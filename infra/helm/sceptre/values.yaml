nameOverride: ""
fullnameOverride: ""
environment: local

global:
  imageRegistry: docker.io/maponyacharles
  imagePullSecrets: []

# KubeRay is part of the default Sceptre release. The operator uses namespaced
# RBAC and watches only the namespace containing this Helm release. Disable this
# dependency only when a cluster-owned KubeRay 1.6.2 operator already watches
# the Sceptre namespace.
kuberay-operator:
  enabled: true
  fullnameOverride: sceptre-kuberay-operator
  singleNamespaceInstall: true
  crNamespacedRbacEnable: true
  leaderElectionEnabled: true
  reconcileConcurrency: 1
  image:
    repository: quay.io/kuberay/operator
    tag: v1.6.2
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: sceptre-kuberay-operator
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

api:
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
    scaleDownStabilizationSeconds: 300
  image:
    repository: sceptreai
    tagPrefix: api
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

reconciler:
  replicaCount: 3
  pollSeconds: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

ui:
  replicaCount: 1
  image:
    repository: sceptreai
    tagPrefix: ui
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

auth:
  jwtSecret: change-me-before-sharing-this-installation
  existingSecret: ""
  jwtSecretKey: JWT_SECRET_KEY
  simpleAuthEnabled: true
  publicAppUrl: http://localhost:8080
  passwordResetEmail:
    # Password reset links are delivered only by email. The API never returns them.
    host: ""
    port: 587
    username: ""
    password: ""
    usernameKey: SMTP_USERNAME
    passwordKey: SMTP_PASSWORD
    fromEmail: ""
    startTls: true
    useSsl: false

postgresql:
  enabled: true
  image:
    repository: sceptreai
    tagPrefix: postgresql
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  auth:
    database: automl
    username: automl
    password: automl
    # Set to the name of an existing secret holding POSTGRES_DB/POSTGRES_USER/
    # POSTGRES_PASSWORD to reuse it instead of managing credentials here.
    existingSecret: ""
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
    retainOnDelete: true
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

externalDatabase:
  # Used when postgresql.enabled=false. Prefer platform.existingSecret for credentials.
  url: ""
  mlflowUrl: ""

platform:
  # Existing secret keys: DATABASE_URL and, for bundled MLflow, MLFLOW_DATABASE_URL.
  existingSecret: ""
  databaseUrlKey: DATABASE_URL
  qualificationDatabaseUrlKey: QUALIFICATION_DATABASE_URL
  mlflowDatabaseUrlKey: MLFLOW_DATABASE_URL
  workerDatabase:
    # External PostgreSQL requires a separately provisioned worker login/Secret.
    # Bundled PostgreSQL generates and preserves a dedicated analysis credential.
    existingSecret: ""
    urlKey: WORKER_DATABASE_URL
    username: sceptre_analysis_worker
  database:
    poolSize: 10
    maxOverflow: 5
    poolTimeoutSeconds: 10
    connectTimeoutSeconds: 5
    statementTimeoutMs: 30000
    lockTimeoutMs: 5000
    idleTransactionTimeoutMs: 30000
    applicationName: sceptre-api
    sslMode: prefer
    sslRootCert: ""
    pgbouncerTransactionMode: false

seaweedfs:
  enabled: true
  # Keep multi-GiB S3 finalization from consuming the node hosting API replicas.
  goMemoryLimit: 2GiB
  s3CacheCapacityMB: 64
  image:
    repository: sceptreai
    tagPrefix: seaweedfs
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  auth:
    accessKey: automl
    secretKey: change-me-before-sharing-this-installation
    existingSecret: ""
    accessKeyKey: AWS_ACCESS_KEY_ID
    secretKeyKey: AWS_SECRET_ACCESS_KEY
  bucket: automl
  # Browser uploads use this public origin; the API never proxies object bytes.
  publicEndpoint: http://localhost:8333
  ingress:
    enabled: false
    className: ""
    host: storage.localhost
    annotations: {}
  persistence:
    enabled: true
    size: 25Gi
    storageClass: ""
    accessMode: ReadWriteOnce
    retainOnDelete: true
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 4Gi}

externalObjectStore:
  # Used when seaweedfs.enabled=false.
  driver: s3_compatible
  endpoint: ""
  publicEndpoint: ""
  region: ""
  gcsProject: ""
  azureStorageAccount: ""
  bucket: automl
  existingSecret: ""
  accessKeyKey: ACCESS_KEY
  secretKeyKey: SECRET_KEY

uploads:
  allowedOrigins: [http://localhost:8080]
  partSizeBytes: 134217728
  instructionTtlSeconds: 900
  sessionTtlSeconds: 86400
  bufferedUploadMaxBytes: 104857600
  maxUploadSizeBytes: 21474836480
  maxDecompressionRatio: 100
  maxDecompressedBytes: 1073741824
  projectStorageQuotaBytes: 214748364800
  quarantineRetentionSeconds: 604800
  scanner:
    # Required by application startup in staging and production.
    command: ""
    timeoutSeconds: 300
    version: builtin-v1
    signatureVersion: builtin-content-policy-v1

mlflow:
  enabled: true
  workers: 1
  # Additional Host header patterns appended to the generated Kubernetes service allowlist.
  allowedHosts: []
  image:
    repository: sceptreai
    tagPrefix: mlflow
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  externalTrackingUri: ""
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
    retainOnDelete: true
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: 500m, memory: 2Gi}

training:
  maxConcurrentJobs: 2
  maxConcurrentTrials: 1
  rayMaxWorkers: 10
  # When node observation is enabled, size each training pod from the largest
  # schedulable node instead of treating cpu.memoryLimitMb as a cluster-wide cap.
  adaptiveNodeSizing:
    enabled: true
    memoryFraction: 0.8
  activeDeadlineSeconds: 21600
  maxActiveDeadlineSeconds: 604800
  deadlineMultiplier: 6
  jobTtlSeconds: 300
  imagePullPolicy: IfNotPresent
  cpu:
    image:
      repository: sceptreai
      tagPrefix: training-cpu
      tag: ""
      digest: ""
    requestCores: 1
    limitCores: 2
    memoryRequestMb: 1024
    memoryLimitMb: 4096
  nvidia:
    enabled: false
    resourceKey: nvidia.com/gpu
    image:
      repository: sceptreai
      tagPrefix: training-nvidia
      tag: ""
      digest: ""
  intel:
    enabled: false
    resourceKey: gpu.intel.com/xe
    image:
      repository: sceptreai
      tagPrefix: training-intel
      tag: ""
      digest: ""
  cache:
    mode: ephemeral
    emptyDirSizeGb: 5
    size: 5Gi
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteMany
    retainOnDelete: false
  priorityClass:
    enabled: false
    name: ""
    value: -1000

inference:
  image:
    repository: sceptreai
    tagPrefix: inference
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  serviceType: ClusterIP
  externalHost: ""
  externalScheme: http
  ingress:
    enabled: false
    className: ""
    # Supports {name} and {deployment_id}; example: "{name}.models.local"
    hostTemplate: ""
    tlsSecretName: ""

capabilities:
  # Adds a separate ClusterRole for node/GPU and PriorityClass discovery.
  clusterObserver:
    enabled: true

ingress:
  enabled: false
  className: ""
  host: sceptre.local
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# Gateway API is the supported production ingress path (P5-W03/P5-W04).
# The API version and controller are pinned; the retired ingress-nginx
# controller must never be referenced here.
gateway:
  enabled: false
  apiVersion: gateway.networking.k8s.io/v1
  className: sceptre
  # Envoy Gateway is the pinned, actively maintained controller for this chart.
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  host: ""
  port: 8080
  tls:
    enabled: false
    secretName: ""

resourceQuota:
  enabled: false
  hard: {}

limitRange:
  enabled: false
  default: {}
  defaultRequest: {}

tests:
  enabled: true
  image:
    repository: busybox
    useGlobal: false
    tag: "1.36"
    digest: ""
    pullPolicy: IfNotPresent
