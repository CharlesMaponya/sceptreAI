# k3d pulls the public Sceptre images from Docker Hub.
environment: local
api:
  image: {pullPolicy: IfNotPresent}
ui:
  image: {pullPolicy: IfNotPresent}
mlflow:
  image: {pullPolicy: IfNotPresent}
training:
  imagePullPolicy: IfNotPresent
inference:
  image: {pullPolicy: IfNotPresent}
ingress:
  enabled: true
  className: traefik
  host: localhost
seaweedfs:
  publicEndpoint: http://storage.localhost:8080
  ingress:
    enabled: true
    className: traefik
    host: storage.localhost
