postgresql:
  enabled: false
seaweedfs:
  enabled: false

# Create these Secrets before installation. The platform Secret must contain
# DATABASE_URL and QUALIFICATION_DATABASE_URL. Provision WORKER_DATABASE_URL in
# the separate worker Secret using its scoped login; the object-store Secret
# must contain ACCESS_KEY and SECRET_KEY.
platform:
  existingSecret: sceptre-external-database
  workerDatabase:
    existingSecret: sceptre-external-worker-database
auth:
  existingSecret: sceptre-auth
externalObjectStore:
  driver: s3_compatible
  endpoint: https://s3.example.test
  publicEndpoint: https://s3.example.test
  bucket: sceptre
  existingSecret: sceptre-external-object-store
mlflow:
  enabled: false
  externalTrackingUri: https://mlflow.example.test
