# Rebuilt three-node k3d runtime. Pass credentials from the private state directory.
global:
  imageRegistry: k3d-sceptre-registry.localhost:5111
api:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
  image:
    tag: api-audit-pages-20260924-r41
ui:
  replicaCount: 2
  image:
    tag: ui-analysis-queue-20260924-r36
reconciler:
  replicaCount: 2
training:
  maxConcurrentJobs: 1
  rayMaxWorkers: 1
  jobTtlSeconds: 30
  cpu:
    image:
      tag: training-candidate-phase-20260921-r26
inference:
  image:
    tag: inference-recovery-20260910-r13
mlflow:
  image:
    tag: mlflow-security-20260826
postgresql:
  image:
    repository: maponyacharles/sceptreai
    tag: postgresql-0.1.12
    useGlobal: false
seaweedfs:
  image:
    repository: maponyacharles/sceptreai
    tag: seaweedfs-0.1.12
    useGlobal: false

# Accept both localhost and the loopback IP for local browser access.
ingress:
  host: ""
uploads:
  allowedOrigins: [http://localhost:8080, http://127.0.0.1:8080]
