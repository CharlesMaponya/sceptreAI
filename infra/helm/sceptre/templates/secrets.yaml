{{- if and .Values.postgresql.enabled (not .Values.platform.workerDatabase.existingSecret) }}
{{- $name := include "sceptre.workerDatabaseSecretName" . }}
{{- $key := .Values.platform.workerDatabase.urlKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sceptre.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ if and $existing (hasKey $existing.data $key) }}{{ index $existing.data $key | quote }}{{ else }}{{ printf "postgresql+psycopg://%s:%s@%s-postgresql:5432/%s" .Values.platform.workerDatabase.username (randAlphaNum 48) (include "sceptre.fullname" .) .Values.postgresql.auth.database | b64enc | quote }}{{ end }}
---
{{- end }}
{{- if not .Values.platform.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sceptre.platformSecretName" . }}
  labels:
    {{- include "sceptre.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "sceptre.databaseUrl" . | quote }}
  QUALIFICATION_DATABASE_URL: {{ include "sceptre.databaseUrl" . | quote }}
  MLFLOW_DATABASE_URL: {{ include "sceptre.mlflowDatabaseUrl" . | quote }}
---
{{- end }}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sceptre.authSecretName" . }}
  labels:
    {{- include "sceptre.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ .Values.auth.jwtSecret | quote }}
  {{ .Values.auth.passwordResetEmail.usernameKey }}: {{ .Values.auth.passwordResetEmail.username | quote }}
  {{ .Values.auth.passwordResetEmail.passwordKey }}: {{ .Values.auth.passwordResetEmail.password | quote }}
---
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sceptre.fullname" . }}-postgresql
  labels:
    {{- include "sceptre.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
---
{{- end }}
{{- if and .Values.seaweedfs.enabled (not .Values.seaweedfs.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sceptre.objectStoreSecretName" . }}
  labels:
    {{- include "sceptre.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.seaweedfs.auth.accessKeyKey }}: {{ .Values.seaweedfs.auth.accessKey | quote }}
  {{ .Values.seaweedfs.auth.secretKeyKey }}: {{ .Values.seaweedfs.auth.secretKey | quote }}
{{- end }}
