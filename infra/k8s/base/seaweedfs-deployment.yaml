apiVersion: apps/v1
kind: Deployment
metadata:
  name: automl-seaweedfs
  namespace: automl
  labels:
    app.kubernetes.io/name: automl-seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: automl-seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: automl-seaweedfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: docker.io/maponyacharles/sceptreai:seaweedfs-0.1.10
          args:
            - mini
            - -dir=/data
          envFrom:
            - secretRef:
                name: automl-seaweedfs-credentials
          env:
            - name: S3_BUCKET
              value: automl
          ports:
            - name: s3
              containerPort: 8333
          startupProbe:
            tcpSocket:
              port: s3
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 300Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: seaweedfs-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: seaweedfs-data
          persistentVolumeClaim:
            claimName: automl-seaweedfs-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
