apiVersion: apps/v1
kind: Deployment
metadata:
  name: automl-mlflow
  namespace: automl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: automl-mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: automl-mlflow
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-mlflow-storage
          image: docker.io/maponyacharles/sceptreai:mlflow-0.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p /mlflow/artifacts
              chown -R 10001:10001 /mlflow/artifacts
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /mlflow
        - name: migrate-database
          image: docker.io/maponyacharles/sceptreai:mlflow-0.0.0
          imagePullPolicy: IfNotPresent
          args:
            - python
            - /opt/automl/mlflow_migrate_if_initialized.py
          env:
            - name: MLFLOW_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: automl-platform-secrets
                  key: MLFLOW_DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: data
              mountPath: /mlflow
            - name: tmp
              mountPath: /tmp
      containers:
        - name: mlflow
          image: docker.io/maponyacharles/sceptreai:mlflow-0.0.0
          imagePullPolicy: IfNotPresent
          args:
            - mlflow
            - server
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --allowed-hosts
            - localhost:*,127.0.0.1:*,10.*,192.168.*,172.16.*,172.17.*,172.18.*,172.19.*,172.20.*,172.21.*,172.22.*,172.23.*,172.24.*,172.25.*,172.26.*,172.27.*,172.28.*,172.29.*,172.30.*,172.31.*,automl-mlflow,automl-mlflow:*,automl-mlflow.automl,automl-mlflow.automl:*,automl-mlflow.automl.svc,automl-mlflow.automl.svc:*,automl-mlflow.automl.svc.cluster.local,automl-mlflow.automl.svc.cluster.local:*
            - --backend-store-uri
            - $(MLFLOW_DATABASE_URL)
            - --artifacts-destination
            - /mlflow/artifacts
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: MLFLOW_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: automl-platform-secrets
                  key: MLFLOW_DATABASE_URL
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: data
              mountPath: /mlflow
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: automl-mlflow-data
        - name: tmp
          emptyDir: {}
