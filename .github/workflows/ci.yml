name: CI and release

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: docker.io/maponyacharles/sceptreai
  CHART: oci://registry-1.docker.io/maponyacharles/sceptre

jobs:
  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest
    steps:
      - name: Require production changes to come from dev
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$BASE_BRANCH" = main ] \
            && [ "$SOURCE_BRANCH" != dev ] \
            && [[ "$SOURCE_BRANCH" != hotfix/* ]]; then
            echo "Pull requests to main must come from dev or hotfix/*."
            exit 1
          fi

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint with ruff
        run: ruff check apps packages alembic scripts tests

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine3.24
        env:
          POSTGRES_DB: automl_test
          POSTGRES_USER: automl
          POSTGRES_PASSWORD: automl
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,ml,k8s]"

      - name: Verify database migrations
        env:
          DATABASE_URL: postgresql+psycopg://automl:automl@localhost:5432/automl_test
          JWT_SECRET_KEY: test-secret-key
        run: |
          alembic upgrade head
          python scripts/verify_database_schema.py
          alembic check
          python scripts/rehearse_phase1_migrations.py

      - name: Validate production-readiness records
        run: |
          python scripts/generate_production_task_index.py --check
          python scripts/validate_phase2_evidence.py

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg://automl:automl@localhost:5432/automl_test
          JWT_SECRET_KEY: test-secret-key
        run: scripts/test_backend.sh

      - name: Upload coverage reports
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: React Regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui/react_app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/ui/react_app/package-lock.json

      - run: npm ci
      - run: npm run test:coverage

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser regressions
        run: npm run test:e2e

      - name: Upload frontend coverage
        if: ${{ always() && hashFiles('apps/ui/react_app/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage-report
          path: apps/ui/react_app/coverage/
          if-no-files-found: error
          retention-days: 14
      - run: npm run lint
      - run: npm run build

      - name: Build the UI runtime image
        working-directory: .
        run: docker build --tag sceptre-ui:test apps/ui/react_app

  syntax-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check syntax with compileall
        run: python -m compileall apps/api packages alembic scripts tests

  repository-security:
    name: Repository Security
    runs-on: ubuntu-latest
    env:
      SECOBSERVE_UPLOAD: ${{ vars.SO_API_BASE_URL != '' && vars.SO_PRODUCT_NAME != '' && secrets.SO_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare reports directory
        run: mkdir security-reports

      - name: Run SecObserve repository scanners
        env:
          SECOBSERVE_IMAGE: ghcr.io/secobserve/secobserve-scanners@sha256:e2ff1b2e34b6dfefd1fbbfecfca0a0f40d389d32630362eb6e1cc2c7b5013fe6
          SO_UPLOAD: ${{ env.SECOBSERVE_UPLOAD }}
          SO_API_BASE_URL: ${{ vars.SO_API_BASE_URL || 'http://secobserve.invalid' }}
          SO_API_TOKEN: ${{ secrets.SO_API_TOKEN || 'not-configured' }}
          SO_PRODUCT_NAME: ${{ vars.SO_PRODUCT_NAME || 'sceptre' }}
          SO_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          scanner_args=(
            --rm
            --volume "$GITHUB_WORKSPACE:/github/workspace"
            --workdir /github/workspace
            --env GITHUB_WORKSPACE=/github/workspace
            --env RUN_DIRECTORY=.
            --env SO_UPLOAD
            --env SO_API_BASE_URL
            --env SO_API_TOKEN
            --env SO_PRODUCT_NAME
            --env SO_BRANCH_NAME
          )
          scan_ignores="--skip-dirs .git --skip-dirs .venv --skip-dirs node_modules"
          docker run "${scanner_args[@]}" \
            --env TARGET=. \
            --env REPORT_NAME=security-reports/trivy-dependencies.cdx.json \
            --env "FURTHER_PARAMETERS=$scan_ignores" \
            --entrypoint /entrypoints/entrypoint_trivy_filesystem.sh \
            "$SECOBSERVE_IMAGE"
          docker run "${scanner_args[@]}" \
            --env TARGET=. \
            --env REPORT_NAME=security-reports/trivy-config.sarif \
            --env "FURTHER_PARAMETERS=$scan_ignores" \
            --entrypoint /entrypoints/entrypoint_trivy_config.sh \
            "$SECOBSERVE_IMAGE"
          docker run "${scanner_args[@]}" \
            --env TARGET=. \
            --env REPORT_NAME=security-reports/trivy-secrets.sarif \
            --env "FURTHER_PARAMETERS=$scan_ignores" \
            --entrypoint /entrypoints/entrypoint_trivy_filesystem_secrets.sh \
            "$SECOBSERVE_IMAGE"
          docker run "${scanner_args[@]}" \
            --env REPORT_NAME=security-reports/gitleaks.sarif \
            --entrypoint /entrypoints/entrypoint_gitleaks.sh \
            "$SECOBSERVE_IMAGE"

      - name: Reject credential leaks
        run: |
          jq --exit-status '[.runs[].results[]?] | length == 0' \
            security-reports/trivy-secrets.sarif
          jq --exit-status '[.runs[].results[]?] | length == 0' \
            security-reports/gitleaks.sarif

      - name: Check the SecObserve security gate
        if: ${{ env.SECOBSERVE_UPLOAD == 'true' }}
        env:
          SECOBSERVE_IMAGE: ghcr.io/secobserve/secobserve-scanners@sha256:e2ff1b2e34b6dfefd1fbbfecfca0a0f40d389d32630362eb6e1cc2c7b5013fe6
          SO_API_BASE_URL: ${{ vars.SO_API_BASE_URL }}
          SO_API_TOKEN: ${{ secrets.SO_API_TOKEN }}
          SO_PRODUCT_NAME: ${{ vars.SO_PRODUCT_NAME }}
        run: |
          docker run --rm \
            --env SO_API_BASE_URL \
            --env SO_API_TOKEN \
            --env SO_PRODUCT_NAME \
            --entrypoint /usr/local/importer/bin/check_security_gate.sh \
            "$SECOBSERVE_IMAGE"

      - name: Preserve security reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: security-reports/
          if-no-files-found: error
          retention-days: 30

  helm-chart:
    name: Helm Chart Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.2

      - name: Lint and render every supported profile
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)"
          helm package infra/helm/sceptre --destination /tmp \
            --version "$version" --app-version "$version"
          chart="/tmp/sceptre-${version}.tgz"
          helm lint "$chart"
          for profile in \
            values.yaml values-local.yaml values-minikube.yaml values-kind.yaml \
            values-k3d.yaml values-microk8s.yaml values-nvidia.yaml values-intel.yaml
          do
            helm template sceptre "$chart" \
              --namespace sceptre \
              --values "infra/helm/sceptre/${profile}" \
              > "/tmp/sceptre-${profile}"
          done
          helm template sceptre "$chart" \
            --namespace sceptre \
            --values infra/helm/sceptre/examples/values-external.yaml \
            > /tmp/sceptre-values-external.yaml
          helm template sceptre "$chart" \
            --namespace sceptre \
            --values infra/helm/sceptre/examples/values-capabilities.yaml \
            > /tmp/sceptre-values-capabilities.yaml
          if helm template sceptre "$chart" \
            --namespace sceptre \
            --set environment=production \
            --set-string uploads.scanner.command=/usr/bin/scanner \
            --set-string uploads.scanner.version=scanner-1.0.0 \
            --set-string uploads.scanner.signatureVersion=signatures-2026-08-20 \
            > /tmp/sceptre-production-missing-region.yaml 2>&1; then
            echo "Production rendering accepted an undefined storage region."
            exit 1
          fi
          helm template sceptre "$chart" \
            --namespace sceptre \
            --set environment=production \
            --set-string uploads.scanner.command=/usr/bin/scanner \
            --set-string uploads.scanner.version=scanner-1.0.0 \
            --set-string uploads.scanner.signatureVersion=signatures-2026-08-20 \
            --set-string externalObjectStore.region=af-south-1 \
            > /tmp/sceptre-production-governed.yaml

      - name: Assert portable defaults
        run: |
          rendered=/tmp/sceptre-values.yaml
          image=docker.io/maponyacharles/sceptreai
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)"
          ! grep -q 'kind: ClusterRole' "$rendered"
          ! grep -q 'nodeSelector:' "$rendered"
          ! grep -qi 'minikube' "$rendered"
          grep -q 'INFERENCE_SERVICE_TYPE: "ClusterIP"' "$rendered"
          grep -q 'DATASET_CACHE_PVC_NAME: ""' "$rendered"
          grep -q 'waiting for database readiness' "$rendered"
          grep -q 'waiting for database readiness' /tmp/sceptre-values-external.yaml
          grep -q 'alembic upgrade head' "$rendered"
          grep -q 'python scripts/verify_database_schema.py' "$rendered"
          grep -q 'waiting for complete API database schema' "$rendered"
          grep -Fq 'resources: ["jobs/status"]' "$rendered"
          grep -Fq 'resources: ["deployments/status"]' "$rendered"
          grep -Fq 'name: sceptre-reconciler' "$rendered"
          grep -Fq 'replicas: 3' "$rendered"
          grep -Fq 'command: ["python", "-m", "automl_api.workflow_reconciler"]' "$rendered"
          grep -Fq 'resources: ["serviceaccounts"]' "$rendered"
          grep -Fq 'resources: ["rayjobs", "rayjobs/status", "rayclusters", "rayclusters/status"]' "$rendered"
          grep -Fq "image: \"${image}:seaweedfs-${version}\"" "$rendered"
          grep -Fq 'OBJECT_STORE_TYPE: "s3_compatible"' "$rendered"
          grep -Fq 'OBJECT_STORE_ENDPOINT: "http://sceptre-seaweedfs:8333"' "$rendered"
          grep -Fq 'UPLOAD_PART_SIZE_BYTES: "134217728"' "$rendered"
          grep -Fq 'BUFFERED_UPLOAD_MAX_BYTES: "104857600"' "$rendered"
          grep -Fq 'client.put_bucket_cors' "$rendered"
          grep -Fq 'OBJECT_STORE_PUBLIC_ENDPOINT: "https://s3.example.test"' \
            /tmp/sceptre-values-external.yaml
          grep -Fq "image: \"${image}:postgresql-${version}\"" "$rendered"
          grep -Fq 'runAsUser: 101' "$rendered"
          grep -Fq 'runAsGroup: 101' "$rendered"
          grep -Fq 'runAsUser: 1000' "$rendered"
          grep -Fq 'runAsGroup: 1000' "$rendered"
          grep -Fq 'mountPath: /tmp' "$rendered"
          grep -Fq 'sizeLimit: 64Mi' "$rendered"
          grep -Fq 'http://sceptre-mlflow:5000/health' "$rendered"
          grep -Fq -- '--allowed-hosts' "$rendered"
          grep -Fq 'sceptre-mlflow:*' "$rendered"
          grep -Fq 'experiments/get-by-name?experiment_name=Default' "$rendered"
          grep -Fq 'name: prepare-mlflow-storage' "$rendered"
          grep -Fq 'chown -R 10001:10001 /mlflow/artifacts' "$rendered"
          grep -Fq '/api/2.0/mlflow-artifacts/artifacts/.sceptre-smoke/' "$rendered"
          ! grep -Fq 'minio/minio' "$rendered"

      - name: Assert public Docker Hub image distribution
        run: |
          rendered=/tmp/sceptre-values-k3d.yaml
          image=docker.io/maponyacharles/sceptreai
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)"
          grep -Fq "image: \"${image}:api-${version}\"" "$rendered"
          grep -Fq "image: \"${image}:ui-${version}\"" "$rendered"
          grep -Fq "image: \"${image}:mlflow-${version}\"" "$rendered"
          grep -Fq "TRAINING_IMAGE: \"${image}:training-cpu-${version}\"" "$rendered"
          grep -Fq "TRAINING_IMAGE_INTEL: \"${image}:training-intel-${version}\"" "$rendered"
          grep -Fq "INFERENCE_IMAGE: \"${image}:inference-${version}\"" "$rendered"
          grep -Fq 'TRAINING_IMAGE_PULL_POLICY: "IfNotPresent"' "$rendered"
          grep -Fq 'INFERENCE_IMAGE_PULL_POLICY: "IfNotPresent"' "$rendered"
          ! grep -q 'imagePullPolicy: Never' "$rendered"

  release-preflight:
    name: Release Preflight
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [branch-policy, lint, test, frontend, syntax-check, repository-security, helm-chart]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.2

      - name: Select the next available release version
        id: version
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          IFS=. read -r major minor patch <<< "$version"
          requested_version="$version"

          while true
          do
            available=true
            for component in api ui mlflow postgresql seaweedfs training-cpu training-intel inference
            do
              if docker buildx imagetools inspect \
                "${IMAGE}:${component}-${version}" >/dev/null 2>&1; then
                available=false
                break
              fi
            done
            if helm show chart "$CHART" --version "$version" >/dev/null 2>&1; then
              available=false
            fi
            if "$available"; then
              break
            fi

            patch=$((patch + 1))
            version="${major}.${minor}.${patch}"
          done

          if [ "$version" != "$requested_version" ]; then
            echo "::notice::Release ${requested_version} already exists; using ${version}."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build ${{ matrix.component }}
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: release-preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: .
            file: Dockerfile.api
          - component: ui
            context: apps/ui/react_app
            file: apps/ui/react_app/Dockerfile
          - component: mlflow
            context: .
            file: Dockerfile.mlflow
          - component: seaweedfs
            context: .
            file: Dockerfile.seaweedfs
          - component: postgresql
            context: .
            file: Dockerfile.postgresql
          - component: training-cpu
            context: .
            file: Dockerfile.training.cpu
          - component: inference
            context: .
            file: Dockerfile.inference
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          username: maponyacharles
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push an untagged release candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true
          build-args: SCEPTRE_VERSION=${{ needs.release-preflight.outputs.version }}

      - name: Smoke-test the candidate by digest
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          candidate="${IMAGE}@${DIGEST}"
          case "$COMPONENT" in
            api)
              docker run --rm --entrypoint python "$candidate" -c \
                "import automl_api; assert automl_api.__version__ == '${VERSION}'"
              ;;
            ui)
              test "$(docker run --rm --entrypoint id "$candidate" -u)" = "101"
              docker run --rm --env API_SERVICE_HOST=127.0.0.1 "$candidate" nginx -t
              ;;
            mlflow)
              docker run --rm --entrypoint python "$candidate" -c \
                "import mlflow, mlflow.server.fastapi_app, psycopg; compile(open('/opt/automl/mlflow_migrate_if_initialized.py').read(), 'mlflow_migrate_if_initialized.py', 'exec')"
              ;;
            seaweedfs)
              test "$(docker run --rm --entrypoint id "$candidate" -u)" = "1000"
              docker run --rm --entrypoint /usr/bin/weed "$candidate" version
              ;;
            postgresql)
              docker run --rm --entrypoint postgres "$candidate" --version
              ;;
            training-cpu)
              docker run --rm --entrypoint python "$candidate" -c \
                "import automl_api, catboost, lightgbm, sklearn, xgboost, zenml; assert automl_api.__version__ == '${VERSION}'; assert zenml.__version__ == '0.96.2'"
              ;;
            inference)
              docker run --rm --entrypoint python "$candidate" -c \
                "import automl_api; assert automl_api.__version__ == '${VERSION}'"
              ;;
          esac

      - name: Reject actionable vulnerabilities and embedded secrets
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --timeout 20m --scanners vuln,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 "${IMAGE}@${DIGEST}"

      - name: Save the candidate digest
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s' "$DIGEST" > "$RUNNER_TEMP/digests/$COMPONENT"

      - uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.component }}
          path: ${{ runner.temp }}/digests/${{ matrix.component }}
          if-no-files-found: error
          retention-days: 1

  build-intel-image:
    name: Build training-intel
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [release-preflight, build-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: digest-training-cpu
          path: ${{ runner.temp }}/cpu

      - uses: docker/login-action@v4
        with:
          username: maponyacharles
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Read the CPU candidate digest
        id: cpu
        run: echo "digest=$(cat "$RUNNER_TEMP/cpu/training-cpu")" >> "$GITHUB_OUTPUT"

      - name: Build and push an untagged release candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.training.intel
          platforms: linux/amd64
          build-args: CPU_BASE_IMAGE=${{ env.IMAGE }}@${{ steps.cpu.outputs.digest }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=training-intel
          cache-to: type=gha,mode=max,scope=training-intel
          provenance: mode=max
          sbom: true

      - name: Smoke-test the candidate by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          docker run --rm --entrypoint python "${IMAGE}@${DIGEST}" -c \
            "import automl_api; assert automl_api.__version__ == '${VERSION}'"

      - name: Reject actionable vulnerabilities and embedded secrets
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --timeout 20m --scanners vuln,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 "${IMAGE}@${DIGEST}"

      - name: Save the candidate digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s' "$DIGEST" > "$RUNNER_TEMP/digests/training-intel"

      - uses: actions/upload-artifact@v6
        with:
          name: digest-training-intel
          path: ${{ runner.temp }}/digests/training-intel
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish Docker Hub Release
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [release-preflight, build-images, build-intel-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          username: maponyacharles
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.2

      - name: Publish clean version tags
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          for component in api ui mlflow postgresql seaweedfs training-cpu training-intel inference
          do
            digest="$(cat "$RUNNER_TEMP/digests/$component")"
            docker buildx imagetools create \
              --tag "${IMAGE}:${component}-${VERSION}" \
              "${IMAGE}@${digest}"
          done

      - name: Verify every published tag
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          for component in api ui mlflow postgresql seaweedfs training-cpu training-intel inference
          do
            docker buildx imagetools inspect "${IMAGE}:${component}-${VERSION}" >/dev/null
          done

      - name: Publish and verify the Helm chart
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io \
            --username maponyacharles --password-stdin
          sed -i "s/SCEPTRE_RELEASE_VERSION/${VERSION}/g" \
            infra/helm/sceptre/Chart.yaml
          helm package infra/helm/sceptre --destination "$RUNNER_TEMP" \
            --version "$VERSION" --app-version "$VERSION"
          helm push "$RUNNER_TEMP/sceptre-${VERSION}.tgz" \
            oci://registry-1.docker.io/maponyacharles
          helm show chart "$CHART" --version "$VERSION" >/dev/null
