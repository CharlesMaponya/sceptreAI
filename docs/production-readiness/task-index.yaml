  - Work
  text: 'Create separate service accounts for API, migrations, inference, reconciliation, backup, and
    telemetry. Dynamically provision project-and-stage-scoped base service accounts and broker/issuer
    bindings for splitter/verifier, preparation, training, champion refit, and champion evaluation, plus
    isolated provider-stage conformance identities. Head and workers receive only an attempt-scoped delegated
    grant: splitter may read its one raw object; preparation/training/refit cannot read raw or final prefixes;
    only the evaluator may read its scope''s final inputs and labels after the allocation CAS. Delete
    attempt pods/tokens during terminal cleanup and disable project issuers on project deletion or security
    revocation. Provision and verify these bindings during project setup, before run admission, so cloud-IAM
    propagation is not hidden inside the 120-second start SLO. Attempts receive short-lived pod tokens
    plus brokered object credentials for the exact attempt; Phase 0A measures principal/service-account
    quotas, delegation latency, expiry, and revocation.'
