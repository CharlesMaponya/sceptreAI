- id: P13-W03
  phase: '13'
  kind: work
  heading_path:
  - 'Phase 13: Final production qualification'
  - Qualification fixture matrix
  text: "Additional task-conformance fixtures are immutable within each task. They prove classification,\
    \ regression, time-series, or clustering behavior but are never compared across tasks or presented\
    \ as the principal benchmark. When QLT-003 is approved, designate the principal benchmark as one of\
    \ those four task fixtures. Its 15-run principal scenario is the homogeneous scenario for that task,\
    \ not an additional group. Together, four homogeneous groups and four 15-run mixed repetitions total\
    \ exactly 120 logical training runs per provider. Without QLT-003, the base is the 15 principal runs\
    \ only. Do not server-side copy or reuse prior objects for the systems upload gate. Do not create\
    \ a full physical ML dataset per experiment or trial. Name users `q00` through `q14`. Homogeneous\
    \ scenarios assign all users the named task. A mixed repetition assigns contiguous groups of four\
    \ to three tasks and a group of three to the remaining task; rotate the three-user task through classification,\
    \ regression, time-series, and clustering in repetitions 0\u20133. Run comparable principal-benchmark\
    \ experiments in one qualification project per provider so all 15 users there reference the same dataset\
    \ version. Before any provider result exists, designate one canonical final-evaluation provider and\
    \ bind each task's only promotional scope/final allocation in `ReleaseFinalTestAuthority`. A trusted\
    \ release-fixture splitter creates the roles once. Distribute signed `validation_only` manifests containing\
    \ only train/validation objects to non-canonical providers; distribute locked final objects only to\
    \ the canonical provider and keep their decrypt/access policy disabled except for the one central-authority-approved\
    \ evaluator. Never send a raw object containing locked roles to a non-canonical provider. All non-canonical\
    \ campaign runs are validation-only and create zero `champion_refit_attempts` or `champion_evaluation_attempts`;\
    \ their separately typed synthetic provider-stage conformance attempts remain mandatory. Mixed repetitions\
