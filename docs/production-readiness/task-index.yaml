  - Work
  text: "Prevent stale profiles from authorizing production launches after a runtime, catalog, node type,\
    \ or provider change. The evidence must distinguish planned, budgeted, and observed fit workload.\
    \ It must not multiply a joint feature-plus-model suggestion by a second feature-grid factor: ```text\
    \ planned_logical_fits = \u03A3trial(inner_folds[trial]) + planned_refit_fits maximum_budgeted_fits\
    \ = \u03A3trial(max_attempts[trial] \xD7 inner_folds[trial]) + max_champion_refit_attempts actual_started_fits\
    \ = count(fold_fit_started events) + started_refits actual_completed_fits = count(fold_fit_completed\
    \ events) + completed_refits ``` Report partial failed-fit runtime, retries, refits, pre-open evaluator\
    \ attempts, the one post-open evaluation, and evidence-finalization time as separate planned/budgeted/observed\
    \ fields; never label a retry ceiling as physical work done. It must distinguish HTTP timeout, run-planning\
    \ SLO, node scale-up SLO, candidate deadline, and whole-run wall-clock SLO. A Kubernetes `activeDeadlineSeconds`\
    \ value is a kill boundary, not performance evidence."
