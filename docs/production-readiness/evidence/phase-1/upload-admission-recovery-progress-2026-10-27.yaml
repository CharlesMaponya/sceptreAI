changes:
- New native admission attempts independently anchor the authenticated actor token
  version. Background work never substitutes the current user token version for the
  original snapshot.
- The actual worker resumes recorded replies through the existing factory-owned admission
  service. Fresh actor/token/membership/project/source/store and unpublished-authority
  checks precede publication; recorded replies need no SDK constructor or native creation.
- Expired issued/unknown S3 attempts reuse the original request, command, object key
  and bounded exact-key inventory path. Actual installed SDK tests against local HTTP503/disconnect
  creation loss observe one native creation and recovery of its original upload ID.
- Live leases cannot be stolen or shortened. Corrupt/auth-revoked rows back off without
  consuming every bounded batch; legacy snapshotless and unknown opaque-provider rows
  are excluded from automatic recovery.
- Five exhausted native attempts pass to logical expiry without recovery backoff perpetually
  renewing their lease. Known expired replies can separately qualify cleanup; logical
  retirement never claims native absence.
