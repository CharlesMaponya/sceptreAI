changes:
- Revision0022 adds private deferred BYTEA input with exact PostgreSQL SHA256/size
  checks and a restrictive project/command foreign key. Command/outbox/response JSON
  never receives the raw input.
- A monotonic INSERT/UPDATE/DELETE trigger protects original source and write-once
  native outcomes. Bytes clear only after publication or retirement, unresolved inputs
  block direct/cascade deletion, and populated downgrade is rejected before custody
  can be dropped.
- Factory-based admission commits source, canonical command and minimal outbox reference
  atomically. Inspection and shared pure provider configuration validation run without
  SDK construction or retained SQL checkout. Fresh role/token/project checks surround
  inspection.
- Replay preserves one original input per key, conflicts on changed identity, rejects
  changed/missing/ambiguous history and retains qualified cached legacy responses.
  No original private source is inferred for legacy pending commands.
- The shared upload schema now rejects normalized empty names/filenames while preserving
  its existing coercion and length-check order. Storage settings validation is shared
  with the existing factory; dataset storage identity also trims configured whitespace.
