changes:
- The actual buffered abort route and periodic cleanup worker share factory-owned
  durable retirement intent, attempts, bounded native retries, original version target,
  independently committed absence and fresh atomic finalization.
- SDK construction and deletion release SQL. Unissued input needs no SDK. Recorded
  cloud data uses its original immutable version; replacements survive. Unknown creates,
  published references and recorded unversioned embedded input hold without deletion.
- Original command/delivery markers bind the independent retirement owner. Known absence
  survives revoked credentials, replaced leases, changed source/policy and publication
  rollback while original bytes and quota stay reserved until qualified finalization.
- Credential epochs bind each native attempt and finalization rather than the semantic
  idempotency identity. Fresh credentials for the original actor can finish a known
  result without another deletion; stale credentials still fail.
- Expiry honors both immutable admission/expires-at timestamps and current TTL. Bounded
  cleanup rotates conflicting owners without stealing abort requests. Retired reservations
  release only through complete authenticated original history; project deletion archives
  that same proof.
