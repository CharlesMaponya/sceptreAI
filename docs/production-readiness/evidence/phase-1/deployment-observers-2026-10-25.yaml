behavior:
- The deployment listing selects original SQL custody and immutable request snapshots,
  commits, performs bounded Kubernetes reads outside SQL, and rechecks current reader/token/project
  membership plus unchanged original source/control before publication. The HTTP response
  shape and pagination stay unchanged; no background service or schema was added.
- Every accepted observation advances a SQL revision, including unavailable observations
  that preserve the logical run status. A newer read, stop/start/cleanup, source mutation,
  project deletion or reader revocation fences an older ready result. Pending launches
  and controls cannot be promoted by listing.
- Native observations pin original namespace lifetime, Deployment/Service/Ingress
  UIDs and specs, completed control generation and replica count. ReplicaSets must
  belong to the original Deployment and template; Pods must belong to those ReplicaSets
  and match the approved Pod spec. Duplicate UIDs, continued lists, changed resourceVersions
  and incomplete readiness fail closed.
- Readiness requires observed generation and enough owned Ready Pods. Container failure
  classification includes stale availability counters; unavailable reads never publish
  terminal success/failure. Unverified access URLs are withheld, and URL schemes/Ingress
  inventory follow original verified resources.
- Name-only native state/URL helpers have been removed from production. Legacy formatter
  tests now call pure formatters through test-only adapters; committed PostgreSQL
  and the real route exercise original selection, inspection and publication.
- Helm grants API/reconciler read access to ReplicaSets and to metadata of their release
  namespace only. API model-resource write permissions, including the old scale patch
  and Ingress create/delete, are withdrawn; the reconciler has the full Deployment
  patch required by the durable protocol. Original Ingress reads/retirement remain
  allowed after the feature is disabled.
