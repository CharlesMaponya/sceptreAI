retained_failures:
- Two unchanged baseline test bodies reproduced SQL held during native listing and
  ready promotion of a foreign same-name Deployment. Both pass after conversion.
- 'The first caller pilot passed 135 and failed the missing-deployment case: its failure
  mapping was omitted while extracting the publisher. The original assertion was retained
  and the mapping restored; the repaired 136-case caller pilot passes.'
- The first expanded observer run passed 35 and failed the completed-restart case
  because its new ReplicaSet fixture returned dictionaries where the existing control
  dispatcher expects SDK objects. Public SDK deserialization now supplies real-shaped
  fixture objects and the retained 36-case checkpoint passes.
- 'Expert review added a stale-availability regression: verified failing Pods must
  not be hidden by a lagging available-replica count. The current native unit and
  connected runs include that case.'
- The first admin-context zero-replica probe passed and retired three UIDs. Config
  review then found missing Helm namespace/ReplicaSet reads and reconciler Deployment
  patch rights; both new Helm negative controls fail on the old template. Chart/dependency
  inputs were added to the frozen manifest before repair.
- 'The first limited-token probe failed with HTTP401: the installed SDK legacy token-key
  alias did not apply its Bearer prefix. The private harness now uses the canonical
  BearerToken key and removes admin client credentials. The failed namespace, both
  model resources and all eight RBAC UIDs were retired. The repeated token-based probe
  passes.'
