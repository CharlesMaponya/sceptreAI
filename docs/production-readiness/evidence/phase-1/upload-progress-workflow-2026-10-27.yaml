changes:
- Actual progress HTTP handler commits request authentication SQL and invokes a factory-owned
  observation. Project-first locks freshly check actor/token/membership, project,
  original admission/source/store and completion/retirement command barriers. SDK
  construction and native reads hold no SQL connection.
- Original private observation identity and projection are compared after SDK construction
  and after native reads. Concurrent actor/source/hold/terminal/instruction changes,
  lost completion metadata with independent command history, and older observations
  cannot overwrite current rows. Actual concurrent PostgreSQL commits occur during
  the provider callback.
- Provider byte counts and exact transfer receipt bounds are validated before publication;
  malformed, duplicated, regressing or synthetic offset receipts are rejected. GCS
  offset-only progress and fresh terminal cached reads remain supported. A ready flag
  alone does not claim bytes were confirmed, and progress never grants digest/READY
  verification authority.
- Actual owning PostgreSQL backend termination during progress commit rolls the projection
  back; retry succeeds. Provider failure and projection-response failure also preserve
  existing state.
- Shared S3 progress enumerates all original part pages with bounded100calls/1000parts
  per page and the existing10000-part ceiling. Repeated/nonadvancing markers, foreign
  targets and malformed parts fail without adopting partial inventory. Installed SDK
  plus local HTTP and real PostgreSQL read1001metadata parts over two pages without
  large data allocation.
