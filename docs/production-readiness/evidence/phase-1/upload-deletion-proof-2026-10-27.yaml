changes:
- Project deletion admission and every queued stage now use SQL-only proof of original
  upload authority retirement. Terminal/READY/expired metadata alone, missing or relabelled
  history, and orphan native completion/retirement/instruction commands cannot bypass
  the guard before storage/runtime effects.
- Ordinary remote uploads need original published admission/store/byte/namespace context
  plus authenticated published native completion pinned to its immutable receipt,
  or original verified retirement through existing journals and fresh checks. Existing
  unpublished-admission cleanup retains its independent proof path.
- All instruction request/actor/source bindings are checked, including superseded
  keys, with bounded-memory batches. The101-entry control independently counts all101
  inspected records, without relying on PostgreSQL row order. Current instruction
  receipt/projection corruption and altered historical source/request hashes hold
  deletion.
- Azure native block completion is not treated as revocation of write/create SAS authority.
  The existing conservative upload-expiry upper bound must pass, AND original native
  closure must still be qualified. Actual Azure driver with an injected service covers
  before/equal/after expiry and refuses expiry-only staged authority. These are local
  contract checks, not deployed cloud/IAM evidence.
- Independent DatasetVersion legal holds/retention now participate in the shared deletion
  policy guard, alongside upload-session policy. A real failing request baseline is
  corrected; all four queued stages honor version-only holds/future retention, while
  equal/past deadline positive controls proceed.
- Legacy remote or contradictory native history is held for controlled source qualification,
  never guessed or re-signed. Legacy embedded metadata without native command/marker/instruction/external-URI
  evidence retains its no-browser-credential path; actual Embedded driver cannot issue
  browser transfer authority. This does not qualify all legacy physical cross-store
  cleanup.
- Original verified completion and staged retirement both traverse all four project
  deletion stages in positive controls without blanket blocking. Retention, store
  and provenance corruption preserve data before any provider construction or runtime
  effect.
