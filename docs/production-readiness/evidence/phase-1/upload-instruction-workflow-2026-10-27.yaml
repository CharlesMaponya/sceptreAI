changes:
- Actual instruction route commits request SQL then freshly checks active actor/token/membership/project,
  original published admission/source/store/origin/cursor. Original command and compact
  per-unit owner/attempt anchors commit before SDK construction and credential/signing
  work outside SQL.
- Original request/source/actor hashes, per-unit ownership, native lease and attempt,
  known receipt and published projection cross-check before delivery. Known replies
  persist independently before fresh publication and replay without another provider
  constructor or credential request. Revocation, source/policy changes or publication
  rollback cannot deliver a stale capability.
- The native lease is released only after a known reply commits. Erasing known reply
  metadata cannot downgrade this independently released lease into fresh issuance.
  Live same-key or competing-key owners cannot be stolen; unknown signing can retry
  only the original target after a five-minute lease and at most five times per command,
  regardless of reporting counters.
- Explicit new keys may refresh a settled transfer unit; superseded original history
  and late replies remain recorded without becoming current delivery authority. Different
  units preserve independent owner entries. Legacy complete known responses are read-only
  after current checks; unknown history is not regenerated.
- GCS shared service and driver now retain the actual confirmed partial offset rather
  than forcing the original unit boundary. Original session URL and content range
  are preserved. Azure installed SAS signer tests use an injected test delegation
  callback outside SQL, including token rotation before publication; no deployed Azure/IAM
  qualification is claimed.
- Three actual owning PostgreSQL backend terminations cover intent, receipt and publication
  commits. Intent rollback performs no credential request, receipt rollback retains
  a leased unknown outcome, and publication rollback replays the separately committed
  known reply. Orphan instruction commands preserve the existing project-deletion
  barrier when upload metadata disappears.
