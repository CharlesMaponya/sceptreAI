behavior:
- The actual begin route captures authenticated actor/token version, commits its authentication transaction
  and delegates to a factory-owned workflow. Project-first locking freshly checks actor/token/membership/project
  and reserves quota with an initiated upload plus original request/target/issued attempt before native
  session creation. SDK construction and begin callbacks hold zero SQL connections.
- Known native replies are validated and retained independently before fresh authorization/source publication.
  Revocation or a publication rollback leaves the initiated reservation and known receipt intact. Fresh
  authenticated retries publish the original known receipt without repeating creation; conflicting requests
  and live attempts cannot issue another logical session.
- Native key namespaces include a committed random intent UUID below the deterministic API session UUID.
  This prevents fresh admission from adopting unrelated multipart state under a legacy or missing-history
  deterministic key. Lease retries reuse the same original request namespace.
- Independent command anchors bind original intent, native attempt, known receipt and result. Missing/corrupted
  custody and downgrade of a recorded outcome cannot restart native work. Superseded-attempt replies remain
  in command metadata and cannot replace the winner; they may alias its native identity and must not be
  blindly aborted by cleanup.
- Configured backend type, endpoint/public endpoint/bucket/region/GCS project/Azure account and actual
  driver are fingerprinted without storing credentials. Changed configuration cannot publish a retained
  reply or rebind transfer/completion/retirement/verifier/offline reads of new admissions. The existing
  minio alias and credential rotation preserve identity. A shared mutable caller payload is deeply copied
  before constructor callbacks can change it.
- Unpublished admissions cannot issue transfer/progress/completion/retirement work using an empty native
  ID. Existing direct-service fixtures use the new factory workflow. Policy/quota rejection moved from
  four mock-only begin checks into real PostgreSQL cases; instruction/progress/registration positives
  remain.
- Live hold/retention/readiness/reference checks remain separate from immutable byte/object identity.
  Releasing a published staged/dataset hold and allowing an extended upload/version retention deadline
  to expire can retire the original identity without rewriting its receipts. Verification keeps original
  authenticated policy snapshots in proof scopes while allowing current policy to change; released-hold
  reads preserve the original byte proof.
- One real subprocess is SIGKILLed after committing issued intent/quota and writing a controlled native-creation
  witness. Parent recovery selects the witnessed session after test-clock lease expiry without another
  controlled native write. This proves the SQL/process boundary with controlled provider state; it is
  not a deployed cloud process-loss journey. Separate installed-SDK/local-HTTP provider profiles also
  pass.
- A controlled GCS unknown-response case renews only an unpublished opaque capability, and only the current
  attempt publishes. Complete provider lifecycle and cleanup qualification remain open. All ten current-source
  profiles pass with no failures/errors/skips; counts overlap.
