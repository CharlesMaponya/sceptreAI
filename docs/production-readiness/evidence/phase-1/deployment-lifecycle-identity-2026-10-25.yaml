    Factory-owned control admission/dispatch, committed control generations and complete
    process-loss/ordering qualification remain required; this is native target identity
    and retirement observation, not full lifecycle completion.
  - DELETEs currently pin the original UID. The durable control conversion must also
    fence resourceVersion/control generation so a delayed older cleanup cannot override
    a newer control, including no-op scales.
  - Legacy, partial and unknown native histories require controlled qualification;
    no guessed native UID or rewritten historical proof is accepted. Modern launches
    known not to have started Kubernetes work remain cancellable.
  - Namespace admission fencing for creation and complete worker credential withdrawal/IAM/network
    restrictions remain required. Native deployment observers still need SQL separation
    and complete lifecycle custody.
  - The native probe keeps replicas at zero. It verifies primitives and same-name
    replacement refusal, not a running inference image, positive-replica restart,
    native Pod finalizer/process-loss campaign, real cloud IAM or the complete control
    workflow.
  - Current full backend/release and independent branch coverage >=90.01 percent,
    maintained images, actual prior binaries/mixed versions/cloud providers and complete
    native workflow journeys remain required.
  - 45 GB migration qualification and 15 users each uploading 10 GiB require suitable
    infrastructure; neither was run locally.
