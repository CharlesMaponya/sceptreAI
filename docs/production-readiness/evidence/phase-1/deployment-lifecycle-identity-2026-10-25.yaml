retained_failures:
- Three unchanged baseline control bodies reproduced foreign same-name mutations through
  stop, start and cleanup. All pass after conversion; the earlier equivalent draft
  baseline is retained.
- The first three-control implementation run passed, followed by 35 unit identity/retirement
  cases. Draft lint found a leftover calls variable in a combined legacy test after
  its fixture conversion; the original job-cleanup callback was restored.
- The first PostgreSQL expansion passed 45 and failed 1 because a test helper returned
  an expired ORM instance after closing its session. It now captures the status inside
  that session, preserving the business assertions.
- The second expansion passed 47 and failed 1 because its test directly assigned a
  frozen Settings field. The fixture now uses dataclasses.replace; the current 50
  focused cases pass.
- The first caller pilot passed 121 and failed 9 because older business fixtures omitted
  the new custody dependency, including a bare404 standing in for verified retirement.
  Explicit test-only dependency stubs restore their intended scope;403/503 assertions
  remain, while raw404 handling and actual retirement are tested below that abstraction.
  The repaired 130-case pilot passes.
