behavior:
- All three control services require original modern deployment admission and immutable
  submission receipts. Namespace, run/project identity, actor/command, manifest/request
  digests, original object receipt and native UID/spec are checked; legacy or partial
  native histories cannot fall back to names.
- Scale operations read original custody, normalize only the approved replica field
  when comparing the saved full observed spec, and use JSON patches testing original
  UID and current resourceVersion before changing replicas. Observed native CAS conflicts
  return HTTP 409 without overwriting logical state.
- Cleanup preflights every original resource before deletion and follows the saved
  Ingress/Service/Deployment inventory even when current ingress configuration is
  disabled. Every DELETE has the exact original UID precondition and foreground propagation;
  replacement resources are never adopted or deleted.
- A cleanup acknowledgement is not retirement. Original resources must be absent and
  labeled ReplicaSets/Pods and list continuation must be empty in the original namespace.
  Pending retirement returns 409, preserves metadata and keeps the submission deletion
  barrier.
- Physical retirement is stored as a canonical receipt bound to the unchanged creation
  journal, original namespace UID and original resource UID map. Missing/malformed/coerced
  or misbound evidence cannot lift the barrier; SQL connection loss after native deletion
  recovers without deleting again.
- Known unstarted modern launches retain SQL-only cancellation/cleanup. Their original
  admission and protocol are checked and the original producer subsequently acknowledges
  cancellation without object/Kubernetes writes. This does not classify unknown native
  starts as unstarted.
- Permission and model-custody gates, active replacement checks, stop/start logical
  state and qualified restart/download behavior remain covered. Old unit fixtures
  now explicitly stub the native-custody dependency; committed PostgreSQL tests exercise
  the real proof and retirement paths.
