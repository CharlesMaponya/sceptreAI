verified:
- Replaced destructive CHECK string normalization with parsed PostgreSQL expression
  structure
- Rejects changed Boolean/arithmetic grouping, string contents, quoted identifier
  identity and meaningful casts
- Normalizes only recognized text-column literal comparisons and IN/ANY reflection
  forms; arithmetic and unrelated casts remain structural
- Native index definitions preserve predicates, expressions, uniqueness, sort/null
  placement, include columns, access methods and operator classes
- Rejects redundant duplicate index definitions and invalid/not-ready/not-live indexes
- A real failed CREATE UNIQUE INDEX CONCURRENTLY leaves an invalid index that is rejected
- Accepts equivalent index names, table qualification, default btree/ascending/null
  ordering and creation-time concurrency option
- Unchanged full 42-table schema passes, including the read-only connection test
- SQLGlot 30.21.0 pinned; API hash-lock regeneration changed only that package; hash-enforced
  package installation verified
negative_controls:
- Old CHECK normalizer missed ten actual PostgreSQL mutations
- Old index comparator missed seven definition mutations plus an actual failed concurrent
  index build; expression-column mutation was already rejected
- First parser implementation had two failures serializing SQL type nodes; fixed and
  preserved in schema-expression-serialization.log
- Synthetic length() positive control now explicitly includes the PostgreSQL text
  cast; arbitrary function cast equivalence is intentionally not inferred
remaining:
- Identity/sequence and computed-column semantics need coverage
- Unique NULLS NOT DISTINCT, CHECK NO INHERIT and other constraint/type/collation
  options need verification
- Complete large-byte-column inventory and supported-prior-schema production-sized
  migration rehearsal
- Full API runtime image build/deployment qualification; these changes are not yet
  deployed to k3d
- All other retained Phase 1 requirements and five broader integration gates
