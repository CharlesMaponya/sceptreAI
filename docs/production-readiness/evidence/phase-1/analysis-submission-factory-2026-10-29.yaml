changes:
- Five fault workers now live in repository test support and inherit the parent's
  dedicated test database plus import paths; they no longer depend on ignored local
  scripts or a workstation endpoint. Backend termination remains pinned to each owned
  child PID, application name and database.
- Submission, first-delivery migration and cleanup require the exact launch operation
  for the analysis kind; unrelated or crossed command types cannot authorize native
  work.
- Qualified physical retirement can settle an old generation's own source row after
  the current run moves to a new generation; active moved scopes still cannot authorize
  native submission, and the new scope is preserved.
- Submission and legacy migration enforce the same verified raw-dataset digest provenance
  already required by the public analysis API and worker, before native construction.
- Validation, explainability and drift submission now uses the factory dispatcher.
  Intent and durable capacity/native units commit before SDK effects; native construction,
  capacity sampling, SA ensure, Job create and activation run outside SQL.
- A suspended Job's original UID and full server-normalized specification are independently
  journaled, then UID publication commits before UID/resourceVersion/spec JSON Patch
  activation. Unknown creates are never reissued or adopted.
- Known create/activation facts survive lost replies, stale actors/owners/source and
  process/database failures. Unresolved native units retain custody; a fresh original-context
  observation recovers uncertain activation without recreating the Job.
- Short SQL admission locks serialize durable capacity reservations. Uncertain outcomes
  retain their slot after terminal state, and qualified physical retirement releases
  it. Factory reservations are counted once alongside legacy submitted rows.
- Legacy first delivery records original intent and Job/Pod absence independently
  before fresh scoped publication. Tracking/new manifest commits and defers before
  creation; original migration context and selected proof remain bound while late
  observations cannot change the executable request.
- Cleanup and deletion recognize original factory-known unpublished identities, creator
  context and live activation leases. Unknown creates block erasing history; rehashed
  submission receipts cannot replace the original UID.
- Session-native submission/migration entry points now fail before effects. Historical
  component mocks retain their assertions outside application code, alongside actual
  dispatcher/native qualification.
