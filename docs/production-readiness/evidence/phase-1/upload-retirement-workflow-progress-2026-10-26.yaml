behavior:
- The actual abort route commits its authentication session and delegates to a factory-owned retirement service.
  The cleanup worker passes its session factory directly. Old native-in-transaction abort/expiry helpers are removed,
  and all repository callers/tests use the replacement.
- Separate short transactions retain original intent, native start/attempt/target, independently known outcome and
  typed publication. Project-before-upload locking, fresh actor/token/membership/project and source/retention/hold/dataset-reference
  checks fence native start and publication. SDK construction, original-session observation, abort and exact-version
  deletion hold zero SQL connections in the actual route/worker cases.
- Original targets and receipts are anchored to WorkflowCommand request/response digests with independent native-start
  markers. A five-minute attempt lease fences concurrent requests; old-attempt failure cannot overwrite newer success.
  Known outcomes survive actor/source/hold/project revocation or publication rollback without claiming success or
  repeating native work on observed-result recovery.
- New upload records retain their server-created original store URI, preventing changed bucket configuration from
  becoming a false absent-session result. Unqualified older staged histories stay held. Retiring uploads continue
  reserving quota and block transfer/completion work; project deletion waits for them. Legacy already-aborted histories
  support read-only replay without fabricating retirement proof.
- S3 staged and original-version deletion use their existing independently qualified provider operations. GCS cancellation
  inspects only the original session; browser-completed data receives a retained original session completion receipt
  before exact generation deletion. Unknown cancellation can refine its staged target only to that same original-session
  version; recorded versions cannot be rebound to latest. Original-session status observation can run after application
  expiry without issuing new transfer authority.
- 'A review exposed a completion race: admitted completion was checking native progress while cancellation retired
  the staged input. Fresh retirement checks now precede completion native start, including original-command anchors
  if retirement markers are missing. Unissued completion can be cancelled; issued/unknown completion stays held.
  Pending original verification deliveries are retired with a failure reason once physical upload retirement is
  confirmed.'
- Cleanup preserves expired/completed/quarantine counts, excludes held and unknown histories from destructive selection,
  honors native backoff and does not let waiting records consume every batch. New browser cancellation uses a stable
  per-session idempotency key, shares concurrent requests, retries failed cancellation while retaining persistence,
  and cancels admission that finishes after the user stopped.
evidence_detail:
- The33 retirement workflow cases use real owned PostgreSQL, including the actual abort HTTP route and cleanup worker,
  original staged/completed/quarantine positives, GCS original-session completion/recovery, admitted completion
  race, concurrent keys, stale attempt, publication rollback, eight custody-corruption controls and revocation during
  native I/O.
- One real subprocess commits original native-start custody, writes a controlled original-identity acceptance witness
  and is killed with SIGKILL. The parent observes the committed issued lease, advances the test clock beyond it
  and recovers original absence without another controlled native write. This proves the SQL/process boundary with
  controlled provider state; it is not a deployed cloud process-loss journey.
- The previous actual-route baseline failed because provider work held SQL. First13 and21-case pilots and current33-case
  evidence are retained. The first browser pilot passed59 and failed1 because the test expected null for an API
  that returns undefined; corrected defined/undefined assertions now also prove resume state survives a failed abort
  and is removed after success.
- 'The connected profile now has212 rather than216 cases: four mock-only cleanup cases moved to the real SQL retirement/retention
  matrix. The old three embedded/unknown project-cleanup cases are replaced by three original-version batch-retention
  cases; unknown histories remain explicitly held. The55 retained SQL retention cases still cover hold/future, none/past/equal,
  eligible staging, unknown completed histories, batch limits, legacy aborted replay and stale ORM cache. No retention
  or schema constraint was relaxed.'
- All seven backend profiles,60 browser/API/hash tests, Node24 TypeScript and targeted browser lint pass on the
  same source snapshot. Native SDK/local HTTP provider tests remain separate from the SQL/workflow process-loss
  test.
