  native bytes with HTTP 200, and returned model bytes despite missing original producer receipts. The
  current bodies pass with zero native-read connections and closed unsafe paths.
- Four additional boundary controls reproduced stale cached binding restoration, admission from a cached
  archived registry stage, and non-ASCII credential exceptions in both serving endpoints. Their unchanged
  bodies pass after refreshing the shared selectors and comparing credential bytes consistently.
- The first private boundary-control collection failed because tests was missing from its import path;
  no test case ran. Its diagnostic is retained separately. After correcting the private harness, all four
  genuine boundary controls failed as expected, then passed unchanged after the code fixes.
