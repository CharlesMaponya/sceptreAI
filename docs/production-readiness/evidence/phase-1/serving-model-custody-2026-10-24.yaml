behavior:
- New deployment admission requires the verified original registry model custody and saves its canonical
  digest. Restart and authenticated model download require the same saved binding, original producer receipts
  and native completion.
- The internal download endpoint uses a project-first SQL selection, commits before native reads, reads
  only the original immutable native version, and verifies exact size and full SHA-256 before returning
  bytes. It then refreshes and rechecks current deployment status/tags, project, registry/artifact proof
  and project/source/artifact deletion barriers.
- 'Reuse the common verifier with an optional spool sink: read at most 64 KiB at a time, retain up to
  8 MiB in memory and spill larger models to a temporary file. Existing original model size ceiling is
  5 GB. Native reads check the existing 60-second deadline before and after each read; blocking calls
  still depend on SDK timeouts.'
- The verified response sends exact Content-Length and Cache-Control no-store. Read/availability/spool-write
  errors, corrupt/truncated/extra bytes and changes during native I/O return no model bytes and close
  temporary files. Normal spill-to-disk cleanup is covered with a reduced test threshold, not a large
  native model.
- Legacy deployments missing original bindings return a qualification-required error rather than receiving
  reconstructed history. No historical deployment or receipt is rewritten.
- Registry-entry and deployment-row selectors refresh preloaded ORM objects. Cached archived stages or
  removed bindings cannot authorize a deployment or restart. Both serving authentication endpoints compare
  credential bytes consistently so malformed non-ASCII inputs are denied cleanly. Original serving authentication/project
  checks and deployment lifecycle/business assertions remain intact. No public schema, dependency, database
  migration or runtime image changed.
