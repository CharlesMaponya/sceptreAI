behavior:
- ObjectStoreDriver.delete and every concrete driver now accept optional immutable version. Supplying a version
  selects a separate exact identity path; existing project-wide/all-version callers retain their behavior. Embedded
  rejects versioned retirement without touching its file.
- S3/S3-compatible retirement requires single-attempt SDK configuration, inventories the exact key/version including
  advancing pagination, sends a version-bound delete and independently checks absence. Missing identities, malformed/truncated/nonadvancing
  inventories and permission failures cannot claim retirement.
- Azure sends the original version_id with per-request retry_total=0 and checks version/deleted inventory before
  and after. GCS binds original generation and ifGenerationMatch, disables mutation retries and checks the same
  live and soft-deleted generation. Soft-deleted originals remain pending, with replacement and neighboring objects
  preserved.
- An unknown accepted-write outcome recovers by checking the original identity; absent originals do not cause another
  delete. Confirmation failure after accepted deletion remains a failure until a later independent original-absence
  check succeeds.
- 'Large or incomplete inventories hold instead of claiming absence: S3 caps100pages, Azure10,000entries. The bounded
  exhaustion and later-page original controls pass. These limits are explicit shortcuts requiring resumable scans
  for larger histories.'
evidence_detail:
- Three retained pre-fix positive-control cases failed because existing drivers did not accept a version argument.
  Current63 versioned-deletion cases include14 installed-SDK loopback HTTP cases across S3,S3-compatible,Azure,GCS;
  success, accepted-disconnect and503 loss each issue one exact delete. Actual Azure/GCS SDK parsing also holds
  soft-deleted originals until the fixture expires them.
- The initial GCS wire assertion incorrectly treated background bucket-metadata requests as unversioned object reads.
  The corrected check distinguishes bucket metadata from object GETs, verifies all retirement object GETs carry
  original generation, and deliberately performs a real unversioned replacement read afterward to prove that the
  detector fails. The failed pilot is retained.
- New provider tests are local HTTP/controlled inventory tests. The116 verifier,74 completion and216 connected checks
  are existing real-SQL/service regressions on the new645-input snapshot; they do not execute a new retirement workflow.
limitations:
- Cancellation and cleanup services are not yet wired to exact-version deletion. Existing staged abort and expiry
  cleanup still perform provider work inside SQL; known completion custody and unknown histories remain held. This
  is the next implementation gap, not production-ready cancellation.
- Next work must introduce factory-owned original intent/outcome custody and reach the actual abort route, cleanup
  worker and direct-service tests together. Preserve actor/token/project/source/retention/hold fences, ready immutable
  dataset protection, concurrency/replay and known-outcome capture after revocation. Do not insert native deletion
  into the existing durable_mutation callback or infer receipts for legacy histories.
- Full release/branch>=90.01%, whole identity suite, maintained images, prior-binary/mixed-version compatibility
  and complete deployed native/provider/cloudIAM/admission journeys were not qualified here. New listing/version-delete
  permissions still require actual cloud IAM qualification.
- The45,000,000,000 physical-byte migration and deferred15-by-10-GiB load remain unqualified; largest-table row
  counts remain unspecified. Original deletion:G7 still requires seven missing historical objects. No missing object
  was reconstructed or re-signed. All retirement/upload/parent gates remain formally unmet; Phase1 stays2 Verified/34
  Open.
