  "behavior": [
    "Two actual k3d Jobs ran current source on pinned immutable API/CPU test images in a new bounded namespace on agent-0. Both completed with exit zero and no restarts.",
    "Actual image source hashes match all copied current files; opaque source-directory markers prevent deleted predecessor modules from surviving the layer. Registry manifests/configurations, original dependency layers and exact source-layer tar bytes are independently checked.",
    "The actual API emits the current four-task estimator catalogs; the CPU consumes those catalogs, rejects changed runtime identity and unsafe parameters, fits Ridge with fixed alpha, verifies finite predictions and preserves predictions across serialization.",
    "Both images import current provider control/reconciler/worker modules, require provider-import-verifier-v1, and reject missing/older/newer protocols. The probes have no database/provider credential environment or default service-account token, and execute as UID10001 with a read-only root.",
    "The 164 recorded shared resource identities/specifications/images/restart counts match the preflight baseline. No shared QA resource was changed or restarted."
  ],
  "limits": [
    "These are source-overlay test images using unchanged, previously qualified immutable dependency layers. The fresh production-Dockerfile build remains unqualified: the first build was deliberately stopped before the reserve, and the Docker overlay attempt stopped at its higher reserve guard while unpacking the base. Their original logs and states are retained.",
    "This preflight is not the maintained managed verifier CLI/controller/API path. There is no native safe-copy, data permission, TokenReview, metadata endpoint, CNI denial, token rotation, process-loss or physical grant-retirement qualification from these image probes. No native G1-G4 gate is marked met.",
    "The isolated namespace currently holds two completed probe Jobs, immutable probe ConfigMaps, a quota, service account and deny-all NetworkPolicy. Dedicated native database/store/controller fixtures and the full fault/permission matrix remain required.",
    "The existing 678-test source/transport/deletion/Ray checkpoint remains current; these two native image cases are reported separately, not added as pytest cases.",
    "The 45GB migration and previous binaries remain unqualified. Seven historical QA objects remain missing and original preservationG7 remains abandoned; no historical objects or signatures were manufactured."
