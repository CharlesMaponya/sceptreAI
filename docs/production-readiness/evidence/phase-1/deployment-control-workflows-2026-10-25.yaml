retained_failures:
- The three unchanged baseline control bodies reproduced synchronous native writes
  during admission; all now pass.
- The first expanded run passed ten cases and failed the SQL fault injector because
  str(Jsonb) truncates its payload. The injector now examines the typed original Jsonb.obj
  and verifies actual pg_terminate_backend; the retained eleven-case checkpoint passes.
- A later draft attempted to inspect an expired ORM command outside its session. Capturing
  its ID inside the session repaired the fixture; the retained seventeen-case checkpoint
  passes.
- The retained twenty-one-case checkpoint verifies actor revocation, pending listing
  and terminating deployment recovery. A subsequent evidence preparation assertion
  stopped before changing its test/driver; the existing driver completed normally
  and its terminal artifacts remain retained.
- Final SDK review found direct urllib3 HTTPError timeouts outside the lost-ack wait
  path. The owned regression process group was interrupted deliberately, its partial/terminal
  evidence retained, and OS-error plus real SDK ReadTimeoutError cases now prove zero
  retry-budget use and recovery without another patch. The native probe is repeated
  on the final frozen inputs.
