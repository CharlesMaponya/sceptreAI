behavior:
- Stop/start/cleanup admission is SQL-only. The existing HTTP response shape carries
  logical cancellation or queued restart and an explicit pending state. One immutable
  original control command and outbox entry per locked generation handle concurrent
  duplicate admission.
- The factory-owned deployment.control.v1 dispatcher commits original custody, delivery
  and patch intent before native I/O. It releases SQL before every Kubernetes call
  and saves original native observations independently of lease loss; only the current
  original command/delivery/generation can publish completion.
- Every control patch tests original UID and observed resourceVersion and changes
  generation/command annotations even when replicas already match. A delayed older
  no-op scale cannot bypass the newer native generation. Recovery observes an accepted
  original generation before issuing another write.
- Cleanup admission rejects future restart. Cleanup verifies the original native generation
  and all targets, uses UID plus resourceVersion delete preconditions, waits for original
  resources and labeled workloads to disappear, and commits original retirement before
  releasing the submission deletion barrier.
- Start rechecks active actor, project permission and original model custody. Pending
  controls cannot be promoted by the deployment listing. UI displays starting/stopping/cleaning
  and allows a new control generation after an observed control failure.
- Pending garbage collection, native CAS conflicts and lost transport/database acknowledgements
  defer without consuming the failure budget. Source/custody/lease conflicts fail
  closed. Provider failures retain normal bounded retries and visible failed controls.
- Qualified complete original v3 creation receipts must already be delivered. Known
  unstarted modern cancellation stays SQL-only. Legacy/partial/unknown producer histories
  require controlled qualification and are not silently adopted.
