  Unknown outcomes never authorize another upload.
- Lost worker acknowledgement permits receipt lookup only. Closed receipts bind all
  identities, bytes, digest, expiry, URI and immutable version.
- A reusable SQL publication guard rejects models without their exact verified native
  completion; progress/result publication remains a separate required boundary.
