behavior:
- New declared writers serialize a model and upload once through Pod-authenticated
  control RPC.
- The server derives project/run/attempt/candidate/digest locations from sealed input
  and candidate authority plus the saved submit declaration.
- Each candidate has one durable slot, issuance owner and native intent before I/O;
  distinct candidates can write concurrently.
