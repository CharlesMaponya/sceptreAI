behavior:
- New admissions save deployment-dockerfile-v1 on the run and generated artifact and enqueue deployment.reconcile.v2.
  The captured pre-conversion dispatcher rejects this new topic without native effects; old or mismatched
  history cannot use the new publisher. This is not prior-image qualification.
- The factory-owned dispatcher validates the original actor/command/resource and request hash, current
  model custody, complete source, target key and delivery. It commits a one-shot native intent and releases
  SQL before conditional creation and immutable-version full hash/size verification.
- A lost reply or later delivery reads matching native grant metadata and then verifies the exact native
  version and complete bytes. An absent, mismatched or unavailable native result never authorizes another
  PUT; unknown waits preserve the failure budget and block retirement.
- Original native completion is persisted independently of later cancellation or lease loss, while fresh
  source/delivery checks still gate Kubernetes effects and acknowledgement. Completed receipts cannot
  be rebound to another native version. The original Dockerfile content remains stored for the immutable
  source check.
- Project/run deletion, direct artifact cleanup and previously queued artifact cleanup respect unresolved
  or malformed write history. Known unstarted modern writes, completed original receipts and unrelated
  scopes retain their distinct behavior.
- Actual PostgreSQL backend termination after native acceptance recovers the same object without uploading
  again. Native acknowledgement loss, later Kubernetes failure, changed source, same-owner and different-owner
  successor delivery, cancellation and malformed history are covered.
- The existing Kubernetes handoff uses the verified artifact and performs no object upload. Kubernetes
  creation itself still runs under SQL and needs UID/spec custody and failure qualification; restart/stop
  effects remain required.
- S3, GCS and Azure stat adapters expose original write metadata when present. Their injected-SDK tests
  pass; the actual local TLS probe covers S3-compatible storage only. No migration, dependency or Ray
  worker credential protocol changed.
