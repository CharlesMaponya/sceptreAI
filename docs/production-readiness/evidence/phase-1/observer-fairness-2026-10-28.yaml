status: in_progress
phase_complete: false
scope: Durable Ray observer scan rotation independent of worker progress
source_inputs: 689
source_manifest_sha256: 29c6b656dcabf76e37f4b21316f38983be6a112b2d529d3c754e9f9db4f548a8
changes:
- Nullable last_observed_at records scan selection separately from worker heartbeat,
  lease and updated_at/startup clocks.
- Collection orders by the last scan, falling back to the existing update clock for
  unseen rows; selected rows stamp with database time under SKIP LOCKED locks.
- A specific captured attempt is published without another stamp, preserving current-source
  snapshot fencing.
- Explicit SQL preserves updated_at, and refreshed in-memory scan values match the
  committed observation request.
- Expansion adds no default/backfill, preserves existing domain rows and legacy SQL
  projections, and rollback drops only transient scan bookkeeping.
