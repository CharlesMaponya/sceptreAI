  "scope": "Outbox delivery ownership before external effects and across upload verification commits",
  "finding": "reconcile_entry called external handlers before verifying the current outbox owner; stale, expired and already delivered entries could execute effects. Upload heartbeats could extend a replacement owner lease.",
  "changes": [
