changes:
- Project deletion captures and revalidates the complete original buffered inventory.
  Unissued and known recorded deliveries cancel atomically with owner-authorized deletion
  admission; original unknown writes remain held.
- The existing stage protocol retains original manifest/request/content digests, object-version
  receipts and publication bindings. Every stage revalidates current source, backend
  and policy; no additional table or migration was added.
- Private bytes and original receipt rows survive until all native stages qualify
  cleanup. Metadata publication retires private input and removes project metadata
  atomically; rollback preserves custody and replays without another native erase.
- Independent command and delivery anchors detect missing private history. Published
  metadata must retain its original object binding. Tombstone legal holds and published
  version rows lock through the final SQL transaction.
- Pure original-receipt validation is shared with buffered execution; five backend
  URI bindings are checked without SDK construction during SQL-only custody checks.
