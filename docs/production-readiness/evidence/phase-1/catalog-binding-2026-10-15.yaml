  "changes": [
    "Preparation publishes exact server-owned public estimator rows and a catalog runtime digest, preserving existing release/task/execution-policy metadata. Definitions bind estimator classes, defaults, search dimensions, source hash, Python and the installed distribution-version inventory. Nonfinite server defaults use explicit JSON-safe identities.",
    "Catalog reads resolve within project and task, return stored rows and a usable revision UUID, expose the runtime digest and retain signature_verified=false. Missing catalogs return 404; invalid bound content/task/runtime returns a structured 409. Latest resolution is deterministic by creation time and ID.",
    "Admission rejects stale content relative to the active task catalog, while pinned read requests retain their stored revision identity when runtime-compatible. Equal-content republished IDs are semantically equivalent. Conflicting launch catalog aliases reject before execution intent.",
    "Launch records catalog content/runtime digests alongside the catalog ID. Training startup revalidates project-scoped stored content, task/runtime and selected estimator names/count before dataset reads, object reads or MLflow activity. Bound/fenced and production/staging workers cannot skip missing catalog identity.",
    "Selected-mode estimates use the actual number of available default candidates. Duplicate selected estimator names are rejected, and nullable legacy candidate limits resolve before persistence.",
    "New Ray training commands declare --attempt-protocol training-catalog-v1. Shared workers verify the protocol against durable run kind before admission or status writes. Analysis retains analysis-v1; unsupported typed kinds fail closed. The known predecessor parser rejects the new flag."
  ],
