  "behavior": [
    "The maintained internal attempt router exposes POST /{attempt_id}/objects/read with a closed role/index/nonce body and no-store replies. Authorization/database/provider outages fail closed; replay returns a receipt without another URL.",
    "ProviderGrantReader rereads the projected token for each request, verifies HTTPS/native version/expiry and byte/SHA binding, bounds broker response and streamed chunks, rejects redirects/encoding/range/size changes, and suppresses signed-URL exceptions.",
    "Pod identity authorization is sent only to the broker, never to native storage. Proxy environment variables are ignored; TLS verification stays enabled.",
    "The maintained provider Ray reader no longer constructs an object-store SDK. Missing broker configuration fails closed; raw/final/unlisted/modified declarations cannot broaden the server-approved read.",
    "Ray tasks share a manifest object reference instead of copying the full declaration into every task. Byte/hash/schema/rows/role/decoded-memory and temporary-space checks remain.",
    "A committed pending import is byte-verified through the actual HTTP broker plus reader before READY using real signed fixture Parquet bytes and doubled provider/Kubernetes transports.",
    "The maintained router exposes bounded provider-import start, heartbeat, result and failure endpoints. The first authenticated publisher pod is durably bound to the exact protected execution; a different pod or rewritten intent cannot adopt it.",
    "The verification worker consumes only server-approved manifest and budget, brokered exact-version reads, identity-capped heartbeat and bounded proof publication. API identity is checked before and after descriptor I/O; pod loss cannot commit READY.",
    "The maintained operator importer reuses the same claim, renewal, proof validation and publication implementation. Already committed shared publication replays return the same IDs without another store construction or write.",
    "Worker integration verifies real signed fixture Parquet through the actual HTTP endpoints with doubled Kubernetes and native transport. Changed bytes fail the import; a lost successful result acknowledgement cannot undo committed READY state.",
    "The READY transaction records an exact publication receipt bound to the original publisher, current request/actor/dataset/attempt/fence, proof and response. The original pod can recover only this metadata under fresh TokenReview and unchanged signed source/policy/operator/project/latest-generation authority.",
    "Completed result replay and the explicit metadata-only receipt endpoint return only the original IDs, without SDK calls or renewed data authority. Generic admission, object reads, start, heartbeat and failure remain closed for completed attempts.",
    "After an uncertain result acknowledgement the maintained worker makes exactly one receipt lookup with its unchanged proof and fresh projected token, rather than repeating publication. Tests cover token replacement, lost receipt replies and uncommitted lookup without native publication retries.",
    "The maintained CLI now queues managed verification; the real workflow daemon commits submission intent, creates one bounded Job with per-attempt identity, validates actual observed UID/spec/policy authority, and performs fenced cleanup before replacement or project deletion. Permanent unknown outcomes remain blocked and unqualified.",
    "New descriptor publication is one protected metadata transaction with no SDK creation or external PUT/read-back. Canonical hash/size and exact proof remain bound to the signed receipt. Existing native descriptors remain compatible; legacy uncertain descriptor writes still block publication and cleanup."
  ],
  "limits": [
    "Native provider/Kubernetes/TLS/IAM/current-image permission qualification is not performed here. Kubernetes/provider requests are doubled. Two actual local Ray cases qualify data processing only.",
    "Existing pod manifests still carry ambient authority in other paths. Removing an SDK call does not prove absence of cloud/database/metadata/Kubernetes permission bypasses.",
    "The source requires broker environment and projected identity; there is no ambient-store fallback for provider reads.",
    "Descriptor writes still use privileged API/operator storage. Unknown or late writes, concurrent publication and owned orphan cleanup need durable recovery and native qualification before managed completion.",
    "Managed controller scheduling/isolation, recovery of unfinished publication and uncertain/concurrent/late descriptor writes remain unqualified. A missing or unavailable committed receipt does not authorize the worker to write again.",
    "Existing completed imports without the durable publisher and receipt events cannot bootstrap terminal HTTP recovery. Their controlled operator/upgrade handling remains required."
  ],
