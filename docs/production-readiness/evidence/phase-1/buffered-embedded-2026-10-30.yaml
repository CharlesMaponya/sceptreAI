changes:
- Original local create records a random file-incarnation xattr and fsyncs the original
  inode before exclusive publication. It returns that identity from the original write,
  without reading latest metadata.
- Pinned reads open and validate the original inode. Managed replacement, conditional
  unlink and prefix deletion serialize under a process-safe root lock. A different
  qualified incarnation proves the original is absent and preserves the replacement
  even when its content is identical.
- Directory durability covers the modified parent chain. Missing/malformed identity
  evidence cannot be inferred as original absence. Filesystems lacking the required
  xattr primitive refuse qualified create; existing overwrite operations retain their
  fallback behavior.
- Actual buffered local publication, HTTP abort, policy expiry, rollback/replay, quota
  and project-deletion snapshots use the same original incarnation. Local filesystem
  methods and store construction are checked outside SQL.
- Legacy unversioned buffered receipts remain held for verification/publication and
  standalone retirement. No lost identity is reconstructed in product code; changed/missing
  original histories are not silently upgraded.
