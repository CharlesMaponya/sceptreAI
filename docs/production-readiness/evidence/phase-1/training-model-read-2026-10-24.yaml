behavior:
- New saved ray-training-model-read-v10 adds training-model-read-v1 only to training heads;
  legacy/v1-v9 templates retain their original behavior.
- The admitted current parent Pod can request only a selected published successful candidate.
  The server chooses original input-bound model custody and immutable output-completion version;
  clients cannot select URI, version or object role.
- Replacement reads require the exact predecessor allowlist and lineage, original tracking/metadata
  receipts and unchanged current input digest.
- The shared GET broker commits a checkpoint read intent before one native mint, releases
  SQL for signing, reauthorizes afterward and never remints the same nonce or persists the
  URL. Original deadlines still block retirement.
- The worker uses the shared strict HTTPS/version/encoding/size reader, spools bounded chunks
  and verifies full SHA-256 before worker-only joblib deserialization. Declared reads never
  fall back to storage credentials or retry a lost URL acknowledgement.
- Existing training checkpoint grant roles are reused; no migration, dependency, coverage
  threshold or broad credential withdrawal is introduced.
