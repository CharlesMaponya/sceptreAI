behavior:
- Declared parent/candidate/failure tracking creation and recovery use Pod-authenticated
  control without worker SQL or the inline creation client.
- The existing writer is shared once; its exclusive renewable claim, irreversible
  creation marker, uncertainty recovery, lineage checks, cancellation and error branches
  remain intact.
- Server derives role names, tags, tracking backend and parent ID from the current
  sealed run; selected candidate and live native parent lineage are verified.
- Each role has a committed Pod owner before native effects; parent creation is exclusive
  to the admitted parent publisher.
- Native I/O holds no caller SQL connection/row lock; source, role owner, parent lease
  and token lifetime are checked before writes/publication.
- A native acknowledgement event binds the exact tracking ID to its command request,
  parent, backend and role owner atomically with writer publication.
- Unowned pre-existing tracking commands are rejected rather than assigned a new Pod
  owner.
- Lost HTTP/SQL acknowledgements use GET only. Unknown native creation is not reissued;
  missing acknowledgement repair validates an existing known native record and never
  creates a run.
- Worker resumes the returned ID through existing MLflow behavior; direct worker MLflow
  logging/resume and artifact/data access remain unconverted.
