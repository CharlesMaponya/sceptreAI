behavior:
- S3 multipart completion uses IfNoneMatch:*, requires the single-attempt SDK configuration, and retains the
  VersionId and checksum from that original response. It does not HEAD latest to choose a version. Missing/invalid/oversized
  versions remain errors.
- Azure block-list completion uses the create-only MatchConditions.IfMissing condition with per-request retries
  disabled and retains the original response version_id. Real installed SDK requests prove If-None-Match:*
  on the wire, one accepted commit after503/disconnect and no properties lookup to adopt latest.
- Azure progress now consumes the SDK tuple of committed/uncommitted blocks and its decoded IDs. Strict one-based
  sceptre block names bind each receipt to its transfer unit; SDK completion encodes them exactly once. Old
  fixtures had hidden the tuple/encoding defect.
- GCS session initiation carries if_generation_match=0 with retry=None. Completion reads the original session
  response, bounds streamed metadata to64KiB, validates bucket/key/size and a positive uint64 generation, and
  never substitutes latest object metadata. A308 response with all bytes still does not invent a completed
  receipt.
- Real local HTTP tests exercise all installed SDK protocols. The GCS fixture distinguishes legitimate bucket
  metadata reads from object lookup and deliberately reads replacement generation99 after the completion result
  to positively validate the detector; original completion remains generation7.
retained_pilots:
- 'Four controlled replacement cases failed before the provider changes: both S3 modes, Azure and GCS selected
  latest metadata instead of the original completion response.'
- 'The first connected provider pilot passed120 and failed5: a GCS response context-manager test-double mismatch
  and three Azure SDK cases. An isolated Azure pilot exposed that this installed SDK forwards an unused etag
  keyword with IfMissing; the driver now passes the match condition alone, and real wire headers confirm the
  create-only condition.'
- GCS SDK pilots initially counted bucket metadata GETs as latest-object reads. The fixture now classifies
  the exact bucket path and validates the object-read counter with a real positive control. Captured failure
  logs/XML/source hashes remain in the private evidence directory.
limitations:
- This is a provider component change. uploads.complete_upload_session still has its latest-object recovery
  branch, drops provider_headers and holds SQL during native work. Therefore these driver checks are not end-to-end
  upload custody protection; old upload-service regression tests still cover that unsafe recovery behavior.
- Durable completion intent/receipt publication, acknowledgement-loss/concurrent request fences and current
  caller/source revalidation must be integrated before the new receipt can be trusted downstream. No unknown
  history may be adopted or reissued automatically.
- S3/Azure completion reports acknowledge the declared part byte budget. Original-version byte-size/SHA/scanner
  verification remains required; an acknowledgement alone does not prove actual input integrity.
- Verification ranges and JSON object-backed offline inference still read latest object bytes. Exact-version
  reads, SQL-free scanning/streaming and real TLS refusal before any offline object read remain unfinished.
- These are local protocol servers with actual installed SDKs, not native AWS/Azure/GCS services, IAM, maintained-image,
  deployed inference or full release/branch coverage qualification. Versioned storage is required for the new
  completion contract.
- The45,000,000,000-byte migration and deferred15-by-10-GiB load were not run; largest-table counts remain
  unspecified. The43.5GB reserve and original coverage are preserved. Original phase1-deletion:G7 remains a
  seven-missing-object handoff. No whole requirement or gate is promoted.
