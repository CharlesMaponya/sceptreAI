  "decisive_checks": [
    "Actual PostgreSQL shows engine pool checkedout0 at remote lookup entry; separate sessions can lock both command and run. Another recovery process skips the committed live lease. This proves the caller releases its transaction/connection; brief heartbeat transactions remain necessary.",
    "A separate Python process claims/commits and kills itself with SIGKILL, leaving a durable lease. Independent recovery skips it while live and handles expiry with zero, exhausted and remaining budgets; no remote calls occur once budget is exhausted.",
    "Expired/stolen owner, changed payload/hash/project-resource binding/type/creation state and dataset lineage cannot publish. Boolean-to-integer JSON mutation is rejected. Unknown marker types cannot break the SQL claim query; malformed intents cannot starve healthy work.",
    "Real short heartbeat transactions advance during a slow lookup and reject stale owners/expiry. An intentionally held heartbeat row lock is released before publication; the concurrency control catches the former self-lock race.",
    "Parent publication wins over in-flight recovery, clears the old lease and preserves the one remote ID. Existing HTTP503/dropped-response, lost database acknowledgement, remote tampering, nested identity, retry bounds, queue fairness and repeated recovery checks pass.",
    "Scoped Ruff lint/format and diff checks pass; coverage.json remains unchanged."
  ],
  "intermediate_runs": "Initial36/281 and hardened49/294,51/296 passing cohorts preceded the final52/297 coverage. Review fixed malformed-claim poison behavior, exact marker/type handling and heartbeat/publication ordering. Intermediate harness failures from a missing test import and ORM bool/int dirty equality were corrected; explicit SQL now exercises an actual numeric JSON marker.",
  "limits": [
