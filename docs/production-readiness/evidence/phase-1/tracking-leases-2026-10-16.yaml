    "Qualification uses a separate local PostgreSQL test database, local MLflow SQLite fixtures and real local HTTP fault servers. The actual killed process is a local Python claimant, not a Kubernetes Pod/production service. No current-image/native deployment, PgBouncer failover, production MLflow outage or full journey is claimed.",
    "Orphaned/missing-run history, unsupported legacy metadata/old binaries and permanent unknown outcomes still need controlled handling. Existing recovery has not become a general production legacy migration tool.",
    "Production Train, protected child/provider/predecessor object grants and full native failure qualification remain open. Previous immutable runtime-image evidence predates these source changes.",
