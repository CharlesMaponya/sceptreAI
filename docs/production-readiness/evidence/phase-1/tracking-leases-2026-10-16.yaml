  "changes": [
    "Tracking recovery claims existing model-run commands with FOR UPDATE SKIP LOCKED, records a fresh unique owner,90second lease,heartbeat and retry counter, then commits/closes the session before any remote lookup. It renews via separate short transactions every15seconds; renewal cannot revive an expired/stolen/changed command.",
    "Publication reacquires current command/run rows and requires matching project/resource, operation/type, live owner/expiry, creation marker, request hash, exact typed JSON payload and tracking lineage. A valid result binds the command only; recovery never creates experiments/runs or resumes computation. Failed lookups release their lease, defer60seconds and exhaust budgets durably. Parent-writer success clears any superseded recovery lease.",
    "Malformed legacy command payloads consume bounded claims and defer/fail without remote calls, allowing healthy work behind them. The creation marker predicate uses exact JSONB containment, avoiding unsafe boolean casts. JSON serialization preserves boolean/integer distinctions in the final snapshot comparison. Unexpected remote parent-run tags are rejected alongside existing lineage checks.",
    "Heartbeat shutdown precedes publication, preventing the publishing worker from skipping its own in-flight heartbeat lock."
  ],
