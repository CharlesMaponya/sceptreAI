changes:
- The actual worker dispatcher routes buffered uploads through the SQL-free factory,
  and direct session dispatch refuses the topic. Failures consume delivery attempts
  without refunds; zero/exhausted budgets block SDK construction.
- Unknown creates and exhausted known-state deliveries stop in durable source/delivery/phase/counter-bound
  quarantine, retaining private bytes and quota. Ordinary transient failures retry
  only within the original budget.
- An authenticated administrator replay endpoint records a distinct command, unchanged
  source binding, prior grant/quarantine/budget, credential epoch and bounded additional
  attempts. Same-key replay caches its original receipt; conflicts, corrupted or missing
  histories, stale authority and unknown outcomes cannot create another write.
- A late original native receipt commits independently and can requeue its own known
  delivery only within its existing budget. An exhausted late-known outcome requires
  a new grant; original native identity never changes.
- Known quarantine remains cancellable and expirable. Project deletion transfers its
  original quarantine and replay history through existing stages; standalone retirement
  binds its prior quarantine without discarding the original native target.
- Generic dead-letter replay cannot reset buffered counters or bypass the source-bound
  grant. Fresh grant credentials and administrator role are rechecked before native
  issue and publication, without rewriting the original immutable manifest.
