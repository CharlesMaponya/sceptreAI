behavior:
- S3 staged abort requires original multipart identity and single-attempt SDK configuration. It probes original
  parts before abort, skips another abort if that multipart identity is already absent, then independently checks
  original parts after an accepted abort. Remaining or truncated parts stay pending; malformed/foreign inventory
  and permission failures cannot qualify cancellation.
- Only explicit NoSuchUpload is interpreted as multipart absence. NoSuchBucket or an arbitrary404 is not accepted.
  Provider disconnects with response=None preserve their transport exception rather than being masked by an AttributeError;
  shared original project/prefix cleanup uses the same narrow error guard.
- GCS JSON resumable cancellation now requires its documented499 acknowledgement.200,204,404 and410 do not prove
  cancellation of the original session before completion. Missing/completed/expired outcomes remain unknown instead
  of allowing a false aborted/expired state.
- 'Connected fixture changes reflect the native contracts: cancelled S3 session IDs return NoSuchUpload, and the
  GCS JSON cancellation positive fixture returns499. The prior explicit404 success assertion now asserts controlled
  refusal. Six pre-fix failures and the original499 positive control are retained.'
evidence_detail:
- The staged profile includes24 focused cases and4 real installed-S3-SDK loopback HTTP cases for success, accepted
  disconnect,503 response loss and residual parts. Lost-acknowledgement replay observes the original absent session
  without another abort. Residual parts remain pending and require another abort against the same original identity.
- The first wire pilot passed167 and failed2. A real disconnect exposed response=None in the new S3 error guard;503
  was correctly translated to the existing UploadThrottled type but the test had omitted it. The guard and typed
  expectation were corrected, with both failures retained. Two project/prefix transport-error cases cover the shared
  guard.
- All final profiles run on the same646-input snapshot; the24 focused cases do not by themselves qualify a factory-owned
  SQL cancellation service. Existing116 verifier,74 completion and216 connected checks passed as regressions.
limitations:
- The planned factory-owned cancellation/cleanup service has not been implemented yet. The actual abort route still
  uses durable_mutation around a native helper, and cleanup_uploads_once still holds a SQL transaction across staged
  provider work. Their conversion is still required; native component results do not qualify those callers.
- S3 NoSuchUpload proves multipart-part absence, not absence of a completed object. The service must fence missing/legacy/unknown
  completion histories and use original native version receipts for known completed objects. It must never infer
  completed-object retirement from an absent multipart ID.
- A GCS browser can finish the native object before the API records completion. The new service must inspect only
  the original resumable session, persist any qualified original completion receipt before exact-version deletion,
  or hold an unknown outcome. A404 must not authorize latest-object adoption or a false cancellation.
- New durable intent/outcome custody, current actor/token/project/source/retention/hold checks, concurrency/lease
  attempts, publication rollback and known-outcome capture after revocation remain required. Azure staged abort
  remains unsupported, and ready immutable datasets must remain protected.
- No whole identity/release/branch>=90.01%, maintained image, prior-binary/mixed-version, cloud IAM/admission,45GB
  migration or15-by-10-GiB qualification is claimed. Original deletion:G7 still requires seven missing historical
  objects; none were reconstructed or re-signed. All retirement/upload/parent gates remain formally unmet; Phase1
  stays2 Verified/34 Open.
