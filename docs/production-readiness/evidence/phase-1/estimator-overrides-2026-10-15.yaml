  "oracle_review": [
    "Real PostgreSQL/HTTP estimate reservation rejects a changed fixed value before consumption, then accepts the original launch and identical replay. Same-key changed value conflicts, selection failures leave no committed command/run, and tampered run/candidate policies fail startup.",
    "Actual small Ridge fits cover fixed CV, local Bayes search, durable local search dispatch and Tune dispatch integration. A separate real local Ray Tune search executes two leased PostgreSQL-backed trials with fixed alpha and replays both without new trial rows.",
    "Actual durable Ridge CV verifies same-parent receipt replay with unchanged computation counts; simulated NVIDIA selection/failure exercises CPU fallback and distinct trial identity. These are CPU computations, not hardware GPU qualification.",
    "Actual KMeans fitting preserves explicit n_clusters=3 instead of the automatic sweep. All reviewed estimator schemas accept clone/set_params using representative reviewed values; this does not claim all-estimator fitting qualification.",
    "Previous QA image source/parser probe uses only standard-library code, with supported run-ID positive control, denied new protocol and same Pod UID. Worker main, database and object storage are not invoked."
  ],
  "intermediate_runs": [
    "A direct pre-fix negative control accepted 3 Agglomerative clusters with 8 rows/3 folds although the smallest held-out fitting fold has 2 rows. Four PostgreSQL/HTTP boundary cases now reject invalid Agglomerative/Spectral counts before capacity and intent while accepting Agglomerative=2 and KMeans=3.",
    "After the catalog dimension-copy fix, 1088 broad regressions and 59 focused cases passed. Final gates rerun after adding the held-out clustering guard.",
    "Initial focused 37 and integration 205 cases passed; additional conditional tests exposed raw nonfinite JSON returning 500, fixed in the shared API validation handler.",
    "Fixture import/assumption failures were corrected (MagicMock/RunStatus and CatBoost get_params omitting unset defaults). Subsequent integration: 179 passed.",
    "First broad run: 1078 passed, one independent-process catalog mismatch; source was edited during this run, so it was repeated with frozen source. The frozen run still failed that comparison (1086 passed). A 95-case reproducer isolated the failure to actual cached Ridge search fits: BayesSearchCV changed shared dimension transformers. Training now deep-copies dimensions even without overrides; regression assertions require the entire catalog identity to remain unchanged after every fit. Initial mixed-source and subsequent frozen-failure XML/logs are retained."
  ],
