  "changes": [
    "Generate concrete estimator-discriminated closed parameter models from reviewed server catalog dimensions for all four task types. Only reviewed categorical values, strict scalar types and bounded numeric ranges are accepted; clustering n_clusters uses the existing 2..8 sweep range. Unknown fields, code, package/runtime/device/thread settings and nonfinite values are rejected.",
    "Validate task, selected/enabled candidate compatibility, known class counts and minimum fitting-fold sizes, including held-out transductive clustering fits before capacity admission. Preserve explicit categorical null separately from omission and sort estimator policies before hashing.",
    "Bind the normalized versioned policy to estimate/reservation identity, immutable original launch command and candidate digests. Worker startup rejects altered/missing policy before data and MLflow. Empty requests retain the preceding launch/action hash shape; changed fixed values conflict. Restart validates and copies the source policy; add-model binds its new requested policy.",
    "Copy mutable search dimensions on every fit: BayesSearchCV normalizes dimension transformers in place. Clone overridden estimators, apply fixed values before resource configuration, remove fixed dimensions from search, preserve values in durable trial base specifications and saved best parameters. Catalog identity must remain unchanged after ordinary or overridden search; explicit cluster counts bypass the automatic sweep.",
    "Trial enrollment checks normalized run/candidate policy identity before creating a row, including erased candidate metadata, malformed suggestions and bool/int replacement. Request validation errors omit echoed raw values, returning controlled 422 for raw nonfinite JSON.",
    "Catalog runtime fingerprints include concrete parameter schemas and boot-time schema source identity. New parent manifests/parser and required candidate/Tune dispatch arguments declare training-parameters-v1; incompatible workers fail closed. Analysis remains analysis-v1."
  ],
