changes:
- One SQL-only project-serialized check now accounts for dataset metadata, active
  resumable reservations and all private input. Buffered admission checks before expensive
  inspection and rechecks atomically before source/command/delivery insertion; original-key
  replay remains independent of new quota admission.
- The actual legacy public buffered path now enforces the same check before inspection/native
  work and preserves cached201 replay after quota changes. Its native-in-SQL crash
  gap remains open.
- Published versions are charged once. A version's byte size offsets its active resumable
  reservation, and matching published metadata offsets private custody. Missing, null,
  smaller or inconsistent metadata cannot reduce the known original reservation.
- Unknown/unpublished private input and unqualified retired history retain their full
  reservation. Invalid or zero budgets cannot admit new private input. Aggregation
  uses metadata without materializing private bytes or constructing an SDK.
- Published private accounting uses one grouped metadata join rather than a repeated
  version-history scan for every private row. Pending metadata counts even when autoflush
  is disabled.
