behavior:
- The real JSON offline route bounds body buffering before extending its buffer, parses outside SQL, expires cached
  state and repeats current actor/token/project/model/control/key-binding checks after parsing. Existing editor
  permission on upload reads is preserved.
- Offline selection shares original completion/source/dataset/proof validation with the verifier, requires the original
  delivered outbox and successful command, ready byte/SHA/scanner evidence and unchanged verification policy, then
  commits before provider construction. A frozen descriptor carries only the original URI/version, driver and safe
  input metadata.
- Original-version open/read/close occurs lazily inside the HTTPS multipart iterator, after TLS peer authentication.
  Request-send failures, early consumer stop and read failure close sources/clients without holding SQL. Browser
  credentials are not forwarded.
- A newly admitted/completed/verified upload traverses the actual route and real local mTLS server. The original
  peer receives original-v1 bytes. A same-CA certificate for a foreign Pod is refused before any object open/read.
  Body, store construction, read and close observe zero checked-out connections.
- One actual-route test independently changes token, membership role, project deletion, deployment desired state,
  upload source, original receipt, verification proof, outbox anchor and scanner policy while the JSON body is read.
  All nine refuse before object-store construction. Ten additional real PostgreSQL descriptor-tamper cases and a
  positive descriptor read pass.
