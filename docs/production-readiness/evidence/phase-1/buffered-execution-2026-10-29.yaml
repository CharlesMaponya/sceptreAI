changes:
- A factory commits issued custody before create-only native work, retains qualified
  original replies in an independent transaction and verifies only the pinned version
  before publication. SDK construction and provider work release SQL.
- Fresh actor/token/membership/project/backend/source/delivery checks fence issue,
  verification and publication. Known original replies survive revocation, command
  changes and replaced leases; unknown outcomes never reissue or adopt latest.
- Publication allocates compatible dataset versions, caches the 201 response, clears
  private bytes and acknowledges delivery atomically. Rollback preserves original
  receipt and bytes. Native writes do not hold the project allocation lock.
- The shared project-deletion guard now holds before prefix erasure whenever any buffered
  input is unretired or original private history is missing. This is an interim hold,
  not complete retirement integration.
- Private source now binds the original idempotency key; pure backend fingerprinting
  is shared between admission and execution.
