  "decisive_checks": [
    "Both actual endpoint functions run against a dedicated PostgreSQL database with genuinely committed, uniquely owned fixture rows and independent SQL connections. At mint entry the caller has no transaction, its engine has zero pool checkouts and another transaction immediately locks both scope and attempt. Owned project/user rows are deleted and scope/attempt absence is checked in teardown.",
    "Concurrent scope cancellation, attempt supersession/fence/expiry, shortened scope/lease deadline and valid plan replacement are committed during minting. The stale endpoint raises409 and does not return the URL. A strongly retained old ORM plan event cannot conceal changes, including when expire_on_commit=False.",
    "Valid mint and repeated read succeed with no-store. Heartbeat extension succeeds. A controlled endpoint clock proves original URL deadline expiry is rejected even when the attempt lease was extended. The clock test is a deterministic expiry boundary, not a real long-duration provider timeout.",
    "Provider failure raises generic503 and leaves zero caller checkouts; its private URL is absent from the HTTP detail. Existing HTTP authentication/scoping, actual local HTTPS credential-free workers, publication and protected one-shot credential regressions pass.",
    "Ruff lint passes for all three changed Python files. Formatting passes for the evaluator route, new test module and changed refit endpoint block; unrelated pre-existing refit formatting is preserved. Diff checks pass and coverage.json is unchanged."
  ],
  "intermediate_runs": "Initial focused20 pass; regression harness first failed before collection due an incorrect filename. Corrected run had113pass/2fail because registering the evaluator-control module as a global pytest plugin widened its autouse S3 URI fixture. Replaced plugin registration with fixture imports local to the new module;20/115 passed. Final original-deadline guard and two deterministic boundary cases yield22/117 all passing. Final runner exited1 only for manual G3 awaiting evidence audit; both runnable checks exited0 and matched EXPECT.",
  "limits": [
    "This proves local caller transaction release and fenced disclosure at the final SQL check. Previously disclosed signed URLs cannot be revoked by local cancellation and remain usable until expiry. A race after final authorization cannot be eliminated without provider-side revocation/attempt enforcement.",
    "The signing helper is exercised through existing provider SDK contracts and local HTTPS byte serving; new concurrency tests inject mint results to isolate authorization timing. Actual cloud signing, Kubernetes process loss/current images, network outage/failover, scale and full grant inventories are not qualified by this increment.",
    "Checks use a separate local PostgreSQL test database and uniquely owned synthetic fixtures. No QA data/object mutation, schema migration, rollout, commit or public publication occurred. The previous immutable image snapshot predates these changes.",
