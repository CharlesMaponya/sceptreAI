behavior:
- Normal admission now selects deployment.reconcile.v4 and generates the pod TLS runtime command, exact
  projected-token audience, memory-backed key volume, UID/fsGroup10001, HTTPS data port8443 and separate
  health port8080. The maintained and generated Dockerfiles select the same runtime.
- A shared serving declaration check protects producer output, every v4 native-write source and certificate
  selection. Static HMAC/database credentials, legacy commands, API-token automount, host networking,
  unexpected execution fields and mismatched ports/probes are refused before native writes.
- Certificate and model-download tests now select real original SQL custody from the new producer. The
  prior key-binding selection stub has been removed; Kubernetes/object calls remain controlled fixtures
  with zero SQL connections during I/O.
- Native execution is compared with the submitted template, allowing only explicit Kubernetes defaults
  and equivalent resource quantities. Unrequested init/lifecycle/host fields cannot gain admission by
  appearing in the first native receipt. Existing checks already reject extra containers.
- Helm references an externally provisioned ca.crt/ca.key Secret and mounts it read-only only into the
  API container. Production requires this authority; configured authorities require the HTTPS /internal/attempts
  control root. Migration/reconciler containers do not receive the mount or path settings.
- TLS deployments withhold raw Service DNS URLs, whose names do not match individual pod certificates.
  Current stop/start/cleanup, status publication and pagination are covered with the new producer.
