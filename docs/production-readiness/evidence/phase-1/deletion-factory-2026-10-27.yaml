- Original Ray/analysis/legacy runtime receipts bind namespace/name/UID and physical
  ownership labels; cleanup uses UID preconditions and checks descendant inventories.
- Store construction and prefix operations release SQL; immutable store/context/root
  bindings and provider-copy protection precede effects.
- Native attempt facts commit independently; current source/policy/delivery is rechecked
  before publication and metadata erasure.
- Expired uncertain deletes inspect first and only repair the same original target
  under writer-retirement barriers; known absence avoids repeat delete.
- Deployment cleanup timestamps alone cannot qualify retirement; original lifecycle
  receipts are required and archived without manifest/secret bodies.
- Committed fixtures and caller migration preserve project-owned teardown; no shared/global
  reset.
