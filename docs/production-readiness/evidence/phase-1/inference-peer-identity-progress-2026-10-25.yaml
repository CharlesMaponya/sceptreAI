components_implemented:
- P-256 server certificates bind project/run/namespace/Deployment/Pod identity with a separate client-auth
  EKU. Real loopback TLS rejects foreign peers before prediction headers/body.
- A bounded identity endpoint checks pod-bound TokenReview, original native ownership/template/control,
  current SQL source and a permanent per-Pod public-key binding. Native issuer tests use controlled SDK
  fixtures and real PostgreSQL.
- TLS model download requires native pod verification and the original key binding, releases SQL before
  native/object reads, verifies immutable model bytes and rechecks source/binding before disclosure. Legacy
  HMAC cannot authorize a TLS-tagged model.
- Worker credential code persists its own key, rereads projected tokens, verifies scope/certificates and
  model bytes, and withdraws readiness after failed renewal. The runtime serves mTLS data and separate
  nonsensitive health probes; real local listeners are exercised.
- Worker HTTPX is declared and its hashed dependency lock includes cryptography 50.0.2. TLS components
  are tested in isolated locked API-49 and worker-50 runtimes; the complete worker image/lock is not qualified.
limitations:
- Normal deployment production still uses v3/legacy manifests and static HMAC. The worker entrypoint is
  not yet connected to Dockerfile/deployment admission.
- The ordinary/docs/offline gateway still uses its old name-only plaintext target and SQL/body/object-read
  paths. Both unchanged original security tests still fail on current inputs.
- The producer protocol upgrade, predecessor refusal and legacy retirement compatibility, CA provisioning/Helm/network
  wiring, and gateway/native admission integration remain unfinished.
- No new k3d campaign or inference image execution was performed. Issuer declaration selection is isolated
  in unit fixtures; the full new producer-to-native-to-gateway journey remains unqualified.
- Counts overlap across suites and cryptography versions. The earlier 85/93/86-case development pilots
  are historical evidence, not additional current passing cases.
- All eight scope gates remain unmet. Full release/branch >=90.01%, maintained images, provider/IAM/admission
  journeys, the 45,000,000,000-byte migration and deferred 15-by-10-GiB qualification remain open.
- Original phase1-deletion:G7 still requires seven missing historical objects; none was reconstructed.
