behavior:
- Two baseline failures reproduced missing native attempt reporting. Both admission
  and cleanup now mirror the claimed native attempt number and existing five-attempt
  budget into WorkflowCommand.retry_count/max_retries before native work. The independently
  anchored attempt remains authority; mutable reporting fields cannot extend the budget.
- A real subprocess is SIGKILLed after committed cleanup intent/before SDK construction,
  after native acceptance/before recording, after the known receipt commits/before
  publication, and after publication/before acknowledgement. The actual owned PostgreSQL
  backend is separately terminated after intent flush/before commit and after native
  reply/receipt flush/before commit.
- All six windows use the installed S3 SDK through the actual S3-compatible factory
  against a local HTTP server and the owned PostgreSQL database. Child PID/signal
  exits, backend termination exits, committed SQL phases and native writes are independently
  asserted. Six current-source witnesses are retained under the private evidence directory.
- Recovery preserves one native creation and one native abort per window, exact original
  key/session and unchanged logical retirement. Live leases prevent premature replay;
  an uncommitted intent leaves no cleanup command. Known receipts replay without constructing
  another native client, published results replay without another effect, and lost
  native acknowledgements recover the same session after lease expiry.
- Original admission remains failed/unpublished after cleanup recovery; no original
  upload capability/result is published. Reporting-only mutations cannot permit a
  sixth native attempt. Older known terminal reporting layouts remain read-only instead
  of rewriting their history.
- The first165-case run had four fixture credential-selection failures before reaching
  the intended windows. The fixture now declares the local S3-compatible backend consistently
  with its endpoint and static test credentials; production AWS identity handling
  is unchanged. All final profiles pass.
- The six process cases were repeated on the same frozen source with an explicit private
  basetemp to retain inspectable witnesses after normal pytest retention removed the
  earlier temporary directory. This is evidence retention, not a new source/runtime
  qualification or a disjoint test count.
