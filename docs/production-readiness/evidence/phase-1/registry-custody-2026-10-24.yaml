behavior:
- New HTTP registration and background verification require original producer slot, input-bound reference,
  tracking/metadata receipts, native completion and explicit predecessor authority. Stored custody is
  revalidated on replay; canonical hashes detect numeric representation changes.
- Read the original immutable native version in bounded 64 KiB chunks and verify full SHA-256 and exact
  size outside SQL; revalidate authority and source before atomic publication. The stream checks a 60-second
  deadline before and after each read; blocking transport calls still depend on provider SDK timeouts.
- Original input-reference digests are preserved through the existing validated reference; this increment
  does not recompute the entire historical input graph.
- Models and existing registry entries without original qualified custody return HTTP 409 and require
  controlled qualification. No historical receipt is reconstructed, no historical row is rewritten, and
  a legacy verified flag cannot grant approval.
- The prior SQL-release, role/source revalidation, concurrent-registration, lost acknowledgement, actual
  backend loss and actual process-death controls remain covered. Every original selected-model persistence
  assertion is retained.
- No schema, dependency, Ray credential protocol or public request schema changed.
