retained_findings:
- Three original worker metric cases reached native metadata APIs. A huge integer
  metric also escaped validation as OverflowError. Three v9 model/final cases accepted
  missing metadata readiness. Their original test bodies and failed artifacts are
  retained.
- The first worker run had twelve fixture failures because Settings is a frozen dataclass,
  not a Pydantic model; corrected to dataclasses.replace.
- The first value-based native recovery design was unsafe while a writer remained
  in flight. The final marker and retirement guards now distinguish settlement from
  pre-existing values. The initial two failing retirement logs were accidentally overwritten
  by their passing rerun; they are not claimed as retained automatic negative evidence.
- The v8 fixture initially rolled its policy change back; committing that setup change
  proved real v8 model custody without a metadata readiness record.
- 'The full 2159-case run passed2158 cases and failed one SQL fault-injection harness
  case: before_commit inspected an already flushed dirty set. Only that test hook
  changed to before_flush; all assertions remained intact and the corrected case passed
  against a real terminated PostgreSQL backend. Production inputs and all other test
  bodies are byte-for-byte unchanged.'
