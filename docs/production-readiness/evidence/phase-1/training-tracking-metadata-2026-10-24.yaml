behavior:
- Ordinary parent/candidate/failure metadata goes through Pod-authenticated control;
  native run context, JSON/model artifacts and registry operations remain separate
  open work.
- Immutable request slots bind the original workflow command, tracking receipt, Pod,
  source, role, actor and fence before native effects. Native I/O holds no caller
  SQL connection.
- One synchronous native batch is followed by one per-request completion marker. Neither
  mutation is resent after uncertainty; GET may recover only the exact original marker.
- Pre-existing tag values cannot acknowledge a still-running writer. Missing completion
  markers remain unresolved and block retirement.
- Read-only background inspection uses short SKIP LOCKED claims and rechecks immutable
  intent after I/O. It can settle known effects after cancellation/process death without
  publishing a worker acknowledgement.
- New v9 brokered model writes and final publication require original metadata readiness.
  Model reservations, explicit predecessor references and final-result links freeze
  that proof; missing/tampered history is not manufactured.
- Saved v8 model custody remains usable under its original policy. All27 older captured
  manifests stay unchanged.
- Empty parameter logging remains a no-op; declared tags/parameters preserve native
  string values, including NumPy scalars and parameter infinity. Numeric metrics outside
  native double range are rejected before identity/I/O.
