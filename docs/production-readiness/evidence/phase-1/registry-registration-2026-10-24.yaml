behavior:
- HTTP model registration selects a successful candidate under SQL, commits its read-only
  selection and releases the admission mutex/connection before inspecting storage size.
- The final short transaction refreshes the active user and original token version, current
  project/membership, parent/candidate/schema and deletion barriers before inserting anything.
  Selected artifact, digest, metrics, parameters and dataset identity/hash/schema must match
  the original inspection.
- Concurrent requests for the same canonical registration share one registry entry, artifact
  and version. Existing authorized registration replay performs no native storage read.
- Unavailable or invalid storage sizes cannot leave partial rows. Actual backend termination
  rolls back artifact and registration together; a lost committed acknowledgement recovers
  the existing row without a second read.
- Sibling progress and parent completion/failure do not invalidate an unchanged successful
  selected candidate. Every original selected-model persistence assertion is retained.
- The only HTTP caller and direct service consumers use the two-stage result; no migration,
  dependency, credential protocol or public request schema changed.
