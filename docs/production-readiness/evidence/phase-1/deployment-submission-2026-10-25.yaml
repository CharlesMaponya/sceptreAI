behavior:
- New HTTP admissions use the shared deployment.reconcile.v3 topic. The captured v2
  selector rejects v3 without native effects; v2/legacy deliveries cannot use the
  new creator. This is not prior-binary qualification.
- After original Dockerfile custody, the factory commits namespace UID, source/manifest/object-receipt
  digests and a new creation identity. Every resource has a separate committed one-shot
  start and original request digest before POST.
- Kubernetes namespace reads, POSTs and acknowledgement reads run outside SQL. A successful
  native response is recorded before a later read can observe a replacement. Lost
  acknowledgements only read the original intent-annotated resource; missing or foreign
  outcomes never authorize another POST.
- Each native receipt pins UID, full observed spec digest, original request and creation
  intent. Actual request labels/spec/annotations are checked before saving. Existing
  receipts cannot be rebound; changed namespace lifetime, UID, spec or intent cannot
  publish.
- Pending deployment listings remain progressing and cannot promote a partial launch.
  Final publication requires the original queued/pending phase and unchanged Dockerfile
  receipt. Completion facts persist independently of cancellation or delivery takeover.
  Fresh current authority gates every new resource start and final publication. The
  final transaction compares exactly the observed receipt set and requires every planned
  resource before marking an active deployment RUNNING.
- Unknown/malformed starts and active native resources block project/run and direct/queued
  artifact retirement. Cancelled storage-only deliveries with no Kubernetes starts
  retain their original clear retirement path. UID-bound native lifecycle retirement
  is still required.
- The unused SQL-bound deployment helper and its stub tests were removed; committed
  PostgreSQL publication, twice-replayed delivery and missing run/artifact/content
  controls replace those business checks. Kubernetes SDK clients share an explicitly
  zero-retry transport; no dependency or schema was added.
