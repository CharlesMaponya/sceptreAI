retained_failures:
- Two initial control bodies reproduced SQL held during Kubernetes creation and absent
  creation receipts. Both pass unchanged after conversion. The first draft of the
  SQL control mistakenly asserted inside a callback whose exception the worker handles;
  the corrected oracle captures the observation and asserts after delivery, and genuinely
  fails on the old implementation.
- A drafting topic-map syntax error prevented focused collection and was corrected
  before behavioral qualification. The two original controls then passed; the expanded
  13-case checkpoint passed.
- 'The first connected run passed 315 cases and failed 3: two cancellation fixture
  expectations had incorrectly been changed to expect active native resources, and
  the real HTTP route still used v2. Original cancellation assertions were restored
  and the route now imports the shared topic.'
- An exact live regression was interrupted with SIGINT after source review found missing
  final receipt comparison. The interrupted result is not qualification. A separate
  retained control then reproduced RUNNING publication after journal removal; that
  unchanged control and UID/spec receipt-tampering controls pass after the fix.
- A 324-case checkpoint passed before caller review identified four uncovered races.
  Four retained controls then reproduced changed Dockerfile receipt, premature observer
  promotion, and overwrite of changed status/desired state. Those unchanged controls
  pass on the final source.
- 'A later regression was interrupted after an independently verified fixture mismatch:
  the installed SDK stores Retry(total=0), not integer 0. The assertion now measures
  total==0. Neither interrupted run is counted as a passing regression; the final
  frozen full connected selection is measured separately.'
