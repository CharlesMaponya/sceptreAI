behavior:
- S3 begin retry lookup now requests at most 100 pages of 1,000 multipart entries and follows both native
  markers. A complete inventory with one exact-key identity can replay it without creating another upload.
  Prefix neighbors are never adopted.
- Multiple exact-key identities are an explicit ambiguous history; no oldest/newest upload is silently
  chosen. Foreign/malformed inventory, missing truncation state, invalid IDs, repeated/regressing markers,
  changed marker echoes, page errors or budget exhaustion cannot become absence or authorize creation.
- Native creation response IDs are no longer string-coerced from null/bool/empty values. IDs are bounded
  and control-free, and returned bucket/key must match if present. SDK total_max_attempts must be 1 before
  listing or creation.
- The 78 focused cases include eight installed-SDK/local-HTTP pagination, accepted-creation-response-loss
  and ambiguous-later-page controls across AWS and compatible modes. These are library/HTTP boundary tests,
  not deployed cloud provider qualification.
- The negative baseline genuinely failed 58 of 60 cases before the production fix. All failed baseline
  cases now pass. Eighteen later cases add SDK and page-transition permission/transport/scope controls;
  the neighbor positive verifies retained provider state and no abort.
- The first connected SDK pilot passed 62 and failed 1 because an existing completion test configured
  retries before its positive begin setup. Configuration now changes only after successful begin, so the
  independent completion retry refusal remains tested. Its failure artifacts are retained.
- All nine profiles pass on the same 649-input snapshot. Existing real-PostgreSQL completion/retirement,
  concurrency, retention and process-loss tests remain in connected profiles. Suites overlap; counts must
  not be added.
- The oracle checks current source and terminal evidence, every selected test function, known failing
  baselines, lint/format, strict read-only schema0018/44tables, the original coverage file and the 43.5
  GB reserve. Its self-check rejects stale/running/failed/under-reserve/wrong-runtime evidence. Shared
  k3d namespace/service identity checks are read-only.
