  "changes": [
    "Inline tracking creation and cached replay close the caller transaction before experiment lookup/create, run search/create/get and fluent resume. Fresh work commits an exclusive tracking-writer lease, renews through short independent heartbeats and commits an irreversible creation marker before run POST.",
    "Publication requires current live parent and unchanged command project/resource/type/operation, request hash, typed JSON payload/response, tracking lineage and live owner/expiry. A live writer can supersede read-only recovery but another writer cannot steal its lease. Heartbeats stop before publication.",
    "Errors release only a still-matching owned claim. Stored response states use a closed parser; malformed/ambiguous states block before remote calls. Unknown run outcomes never recreate a missing experiment. Client backend must match committed intent.",
    "Lost-publication-ack test now injects at semantic run-ID publication instead of a fixed commit number, preserving its intended failure boundary after transaction splitting."
