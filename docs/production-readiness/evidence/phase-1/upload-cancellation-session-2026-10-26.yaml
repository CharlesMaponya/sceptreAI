behavior:
- S3 abort now requires the exact original multipart session to be absent. An accepted
  abort followed by a visible empty nontruncated session remains DeletionPending;
  no cancellation receipt may be published from that result.
- Both a service-double case and installed single-attempt SDK/local HTTP case failed
  before the fix because the expected DeletionPending was not raised. Both pass after
  the fix.
- The local HTTP negative control keeps the original session active with zero parts
  after accepting abort, then permits real disappearance on a later controlled call.
  Existing absence, remaining parts, permission failure, malformed/truncated inventory,
  hidden retry, disconnect and throttle controls remain.
- Original key/session parameters are asserted for all wire reads/writes. This cancellation
  prerequisite does not qualify native admission cleanup, deployed cloud outcomes
  or the entire upload lifecycle.
