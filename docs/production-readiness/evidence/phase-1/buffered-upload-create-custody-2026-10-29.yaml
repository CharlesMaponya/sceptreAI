changes:
- ObjectStoreDriver and four concrete drivers expose create_bytes without changing
  existing overwrite callers. It has no public buffered caller yet.
- S3 requires its existing single-attempt client, uses IfNoneMatch, and returns only
  the original VersionId. Azure disables call retries and returns its original write/commit
  version.
- GCS sends expected CRC32C for server validation, disables SDK retries and automatic
  corrupt-outcome deletion, and validates the returned ID, generation, size and checksum
  without latest-object reads.
- Embedded creation uses fsynced private input and an exclusive hard link, preserving
  the concurrent winner and cleaning only its temporary file. It remains local-only
  without immutable versions or power-loss qualification.
