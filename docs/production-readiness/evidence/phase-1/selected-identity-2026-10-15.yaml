  "changes": [
    "Resolve current prepared legacy selected requests into durable project-scoped experiment and objective revisions using natural request identities, unique inserts and exact coherent prepared graph bindings. Explicit spec references and compatibility assertions cannot override recorded identity. All mode requires an explicit spec.",
    "Expose resolved experiment and launch bindings in estimates; persist experiment, objective and declared entity/time roles on runs. The UI carries the estimated experiment into launch; restart and add-model preserve recorded roles/objective.",
    "Scoped launches require the exact experiment as well as split before capacity; a matching spec stays barrier-pending until complete membership. Public named experiment creation validates the graph and records opaque client metadata separately from authoritative identity. Internal compatibility name prefixes are reserved.",
    "Reservation retries replay the original response before identity/capacity preflight. Canonical estimate digests omit the reserve operation flag and legacy execution alias and use resolved candidate count, allowing the same reservation to be consumed by launch.",
    "Separate internal analysis resource assessment from training identity admission. Validation, explanation and drift do not invent training experiments or require training preparation for analysis uploads; project authorization and resource checks remain.",
    "Fingerprint unique distribution/version pairs from interpreter site-packages with an explicit package scope. Duplicate search paths and Ray vendored imports cannot change the installed runtime identity."
