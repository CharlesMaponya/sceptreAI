behavior:
- Ordinary, docs and browser-multipart proxy requests now select the original SQL source, commit before native
  inspection, then revalidate current reader/token/membership/model/control and immutable Pod key binding before
  committing and streaming.
- The gateway connects to a validated numeric Pod IP over HTTPS on port8443, using the original Pod UID hostname
  as TLS SNI and requiring the configured CA, hostname validation and a client certificate. There is no HMAC
  or plaintext fallback; browser authorization/cookies are not forwarded.
- Actual local TLS tests reject a same-CA foreign Pod identity before upstream headers or browser body consumption.
  Original name-only/plaintext negative test bodies remain unchanged and pass.
- SQL selection now locks the model before artifact custody. A PostgreSQL concurrency test reproduced the old
  lock inversion and passes with the shared selection order.
- Response lifecycle cleanup closes the upstream response and client even when a browser disconnects before
  response headers. Both ASGI2.3 and2.4 reproductions pass.
- Native submission revealed that Kubernetes omits the writable mount default readOnly:false. The producer
  now omits this redundant field; projected token mounts remain explicitly read-only and strict ownership/spec
  checks remain intact.
