behavior:
- The baseline actual HTTP request returned404. POST/projects/{project_id}/datasets/uploads/{session_id}/cleanup/replay
  now requires current owner-level authorization and a bounded reason plus Idempotency-Key.
  It returns202 with the approval/root cleanup/session IDs and authorized total budget,
  never a native capability.
- Each approval adds exactly five attempts for the same original known single-creation
  target. The original cleanup remains the sole native owner; the API performs only
  SQL. It preserves the prior attempt, error, terminal reason and ordered approval
  history in a separate succeeded workflow command.
- The root cleanup independently anchors the authorization list. Every approval command
  binds original intent, prior attempt/epoch/chain, actor/token snapshot and reason.
  Missing, erased, duplicated, foreign or corrupted authority fails before native
  work; mutable reporting fields still cannot extend the budget.
- Fresh actor/token/membership, owner role, project, original source/store, hold/retention
  and exhausted/expired-lease checks fence approval. Reused keys return the same approval,
  conflicting reasons/actors fail, and concurrent same/different keys grant one epoch.
  Live, known-result or completed cleanup cannot be reset into another native effect.
- Actual PostgreSQL backend termination during approval commit and injected rollback
  preserve the exhausted root without a partial approval. A committed approval with
  lost HTTP reply replays the same result without more budget. Two full epochs preserve
  prior5/10 attempt snapshots and resume the original command at attempt11 with budget15.
- 'Authenticated replay history participates in project deletion: a corrupted approval
  blocks a queued stage before native effects, and orphan approval commands preserve
  the deletion barrier if parent metadata disappears. The operator procedure is documented
  in phase-1-queue-claims.md.'
- 'Existing six real native cleanup failure windows pass again on current inputs:
  four SIGKILL and two owning-backend terminations, with retained witnesses. Local
  SQL/SDK/HTTP evidence does not qualify all provider/cloud/prior-binary failure windows.'
- The final reserve check initially fell below43.5GB after all functional profiles
  had passed. Only regenerable downloads identified by public PyPI metadata were evicted
  (630039117 cached bytes); installed packages, source, built-wheel cache, fixtures
  and evidence were preserved. The reserve recovered above43.5GB and current integration
  was rechecked.
