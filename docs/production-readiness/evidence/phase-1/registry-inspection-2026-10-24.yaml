behavior:
- The production factory-owned dispatcher closes SQL before registry artifact existence/size
  reads. The old transaction-owned dispatch path refuses this topic.
- Project/command/source and complete original delivery snapshots are reloaded under short
  locks before publication. Changed or expired leases, same-owner reclaims, source changes,
  inactive projects and deletion barriers cannot publish stale inspection results.
- Registry verification, outbox delivery and running command completion commit atomically.
  Verified replay performs no storage reads.
- Native read failures retain existing retry/dead-letter behavior, but can record errors only
  against their exact original delivery. A late failure cannot change a successor with another
  owner or the same owner name.
- Committed PostgreSQL checks exercise in-flight source changes, two competing readers, real
  process SIGKILL, actual PostgreSQL backend termination and lost commit acknowledgement.
- No dependency, migration, credential protocol, native write behavior or coverage threshold
  changed.
retained_failures:
- Original-body baseline observed one checked-out SQL connection at the native read and failed;
  the unchanged body now observes zero connections for both reads.
- The first implementation check was blocked before native reads because its fixture left
  the command PENDING. Production deferred commands are RUNNING; the fixture was corrected
  without changing the original test body or assertions. That failed run remains retained.
