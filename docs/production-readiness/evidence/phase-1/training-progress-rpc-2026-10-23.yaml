  saved v7 submissions; declared workers never fall back to SQL.
- Shared SQL mutations receive an explicit trusted attempt/fence; sealed source, selected
  candidates and parent routing are revalidated around native identity I/O.
- Only the parent publisher may publish the complete selected aggregate; admitted
  candidate Pods may update selected candidate phases.
- Each stream has one Pod/client owner and monotonic sequence; exact request replay
  is idempotent, reused sequences/nonces conflict, and stale updates cannot overwrite
  newer ones.
- A lost acknowledgement uses receipt lookup only; real SQL connection loss rolls
  back both progress mutations and receipts.
- Terminal candidate metadata is immutable across partial and final publication; pending
  snapshots retain accepted terminal outcomes and updates after a trusted final result
  are acknowledged no-ops.
- Resumed candidate row counts survive initial progress, candidate replay and final
  result construction.
