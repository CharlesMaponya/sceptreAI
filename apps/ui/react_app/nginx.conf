upstream sceptre_api {
  zone sceptre_api 64k;
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
  resolver_timeout 5s;
  server ${API_SERVICE_HOST}:8000 resolve;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location /api/ {
    client_max_body_size 100m;
    proxy_pass http://sceptre_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health/ {
    proxy_pass http://sceptre_api;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
